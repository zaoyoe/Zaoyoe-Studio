<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iOS Safari 黑块测试</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: #000000 !important;
            position: relative;
            min-height: 100%;
            overflow-x: hidden;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 默认用 inherit（与 prompts.html 一致） */
        body {
            background-color: inherit;
            font-family: -apple-system, sans-serif;
            color: white;
        }

        html.no-scroll,
        body.no-scroll {
            overflow: hidden !important;
            overscroll-behavior: none !important;
        }

        /* 背景 blobs */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
        }

        .blob-1 {
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 80vh;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
        }

        .blob-2 {
            bottom: -15%;
            left: -10%;
            width: 55vw;
            height: 75vh;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
        }

        .blob-3 {
            top: 35%;
            left: 30%;
            width: 50vw;
            height: 70vh;
            background: linear-gradient(225deg, #db2777, #f59e0b);
        }

        /* 弹窗 */
        .test-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .test-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        /* 控制面板 */
        .controls {
            position: relative;
            z-index: 1;
            padding: 60px 20px 40px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .hint {
            opacity: 0.6;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            opacity: 0.5;
            margin: 20px 0 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn.active-btn {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .close-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .filler {
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .filler-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 5px;
        }

        .tag-current {
            background: #4ade80;
            color: black;
        }
    </style>
</head>

<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="test-modal" id="testModal">
        <div class="modal-box">
            <h2>测试弹窗</h2>
            <p style="margin:15px 0; opacity:0.7;" id="modalInfo"></p>
            <button class="close-btn" onclick="closeModal()">关闭弹窗</button>
        </div>
    </div>

    <div class="controls">
        <h1>🔬 iOS Safari 黑块诊断 v2</h1>
        <p class="hint">当前 body 背景: <span id="currentBg" style="color:#4ade80">inherit (#000)</span></p>

        <div class="section-title">第一步：切换 body 背景色</div>
        <button class="btn active-btn" id="btnInherit" onclick="setBg('inherit')">
            ⚫ body: inherit（当前 prompts.html 用法）
        </button>
        <button class="btn" id="btnTransparent" onclick="setBg('transparent')">
            🔵 body: transparent（其他页面用法）
        </button>

        <div class="section-title">第二步：打开弹窗再关闭，看黑块是否恢复</div>
        <button class="btn" onclick="openModal(true, true)">
            弹窗 A：有 overflow:hidden + 有 backdrop-filter
        </button>
        <button class="btn" onclick="openModal(true, false)">
            弹窗 B：有 overflow:hidden + 无 backdrop-filter
        </button>
        <button class="btn" onclick="openModal(false, true)">
            弹窗 C：无 overflow:hidden + 有 backdrop-filter
        </button>
        <button class="btn" onclick="openModal(false, false)">
            弹窗 D：无 overflow:hidden + 无 backdrop-filter
        </button>

        <div class="result" id="result">⬆️ 先选 body 背景，再打开弹窗测试。<br>每次切换背景后建议刷新页面。</div>
    </div>

    <div class="filler">
        <div class="filler-card">
            <p>滚动填充 1</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 2</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 3</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 4</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 5</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 6</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 7</p>
        </div>
        <div class="filler-card">
            <p>滚动填充 8</p>
        </div>
    </div>

    <script>
        const modal = document.getElementById('testModal');
        const result = document.getElementById('result');
        let currentOverflow = true;
        let currentBlur = true;

        function setBg(value) {
            document.body.style.backgroundColor = value;
            document.getElementById('currentBg').textContent = value;
            document.getElementById('btnInherit').classList.toggle('active-btn', value === 'inherit');
            document.getElementById('btnTransparent').classList.toggle('active-btn', value === 'transparent');
            result.innerHTML = '已切换 body 背景为: <b>' + value + '</b><br>请打开弹窗测试黑块是否恢复。';
        }

        function openModal(useOverflow, useBlur) {
            currentOverflow = useOverflow;
            currentBlur = useBlur;

            if (!useBlur) {
                modal.style.backdropFilter = 'none';
                modal.style.webkitBackdropFilter = 'none';
            } else {
                modal.style.backdropFilter = '';
                modal.style.webkitBackdropFilter = '';
            }

            modal.classList.add('active');

            if (useOverflow) {
                document.documentElement.classList.add('no-scroll');
                document.body.classList.add('no-scroll');
            }

            const info = (useOverflow ? '✅ overflow:hidden' : '❌ 无 overflow:hidden')
                + '\n' + (useBlur ? '✅ backdrop-filter' : '❌ 无 backdrop-filter');
            document.getElementById('modalInfo').textContent = info;
            result.innerHTML = '弹窗已打开<br>overflow:hidden=' + useOverflow + ', blur=' + useBlur;
        }

        function closeModal() {
            modal.classList.remove('active');
            document.documentElement.classList.remove('no-scroll');
            document.body.classList.remove('no-scroll');
            result.innerHTML = '弹窗已关闭 ← <b>请看地址栏是否恢复通透</b>';
        }
    </script>
</body>

</html>
