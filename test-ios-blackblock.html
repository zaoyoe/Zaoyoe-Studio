<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iOS Safari 黑块测试 v4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: #000000 !important;
            min-height: 100%;
            overflow-x: hidden;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background-color: inherit;
            font-family: -apple-system, sans-serif;
            color: white;
        }

        html.no-scroll,
        body.no-scroll {
            overflow: hidden !important;
            overscroll-behavior: none !important;
        }

        /* 背景 blobs - 与 prompts 页完全一致 */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
        }

        .blob-1 {
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 80vh;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
        }

        .blob-2 {
            bottom: -15%;
            left: -10%;
            width: 55vw;
            height: 75vh;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
        }

        .blob-3 {
            top: 35%;
            left: 30%;
            width: 50vw;
            height: 70vh;
            background: linear-gradient(225deg, #db2777, #f59e0b);
        }

        /* 弹窗 */
        .test-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .test-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        .close-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .controls {
            position: relative;
            z-index: 1;
            padding: 100px 20px 40px;
            /* 更多顶部间距，确保向下滚动后 blobs 覆盖工具栏 */
        }

        h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .hint {
            opacity: 0.6;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .section {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.5;
            margin: 18px 0 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .result {
            margin-top: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .filler {
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .filler-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .emoji {
            font-size: 20px;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="test-modal" id="modal">
        <div class="modal-box">
            <h2 id="modalTitle">测试弹窗</h2>
            <p style="margin:15px 0;opacity:0.7" id="modalInfo"></p>
            <button class="close-btn" id="closeBtn">关闭弹窗</button>
        </div>
    </div>

    <div class="controls">
        <h1>🔬 黑块诊断 v4 - 终极测试</h1>
        <p class="hint">
            请先向下滚动一点（让 blobs 出现在地址栏后面），<br>
            然后确认此时地址栏是否通透（有颜色），<br>
            再点击下方按钮测试。
        </p>

        <div class="section">核心对比测试</div>

        <button class="btn" id="btnA" onclick="testA()">
            <span class="emoji">🔴</span> 弹窗 A：有 overflow:hidden（当前行为）
        </button>

        <button class="btn" id="btnB" onclick="testB()">
            <span class="emoji">🟢</span> 弹窗 B：无 overflow:hidden（纯 touch 拦截）
        </button>

        <button class="btn" id="btnC" onclick="testC()">
            <span class="emoji">🔵</span> 弹窗 C：无 overflow:hidden + 无 backdrop-filter
        </button>

        <div class="result" id="log">
            ⬆️ 请先滚动到地址栏变通透后再测试！

            每个测试步骤：
            1. 刷新页面
            2. 稍微向下滚动直到地址栏通透
            3. 点击测试按钮
            4. 关闭弹窗
            5. 观察地址栏是否恢复通透

            重点关注：🔴A 和 🟢B 的区别！
        </div>
    </div>

    <div class="filler">
        <div class="filler-card">卡片 1 - 向下滚动让 blobs 覆盖地址栏</div>
        <div class="filler-card">卡片 2</div>
        <div class="filler-card">卡片 3</div>
        <div class="filler-card">卡片 4</div>
        <div class="filler-card">卡片 5</div>
        <div class="filler-card">卡片 6</div>
        <div class="filler-card">卡片 7</div>
        <div class="filler-card">卡片 8</div>
        <div class="filler-card">卡片 9</div>
        <div class="filler-card">卡片 10</div>
        <div class="filler-card">卡片 11</div>
        <div class="filler-card">卡片 12</div>
        <div class="filler-card">卡片 13</div>
        <div class="filler-card">卡片 14</div>
        <div class="filler-card">卡片 15</div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const logEl = document.getElementById('log');
        const closeBtn = document.getElementById('closeBtn');
        let currentMode = '';
        let touchStartY = 0;

        function log(msg) { logEl.textContent = msg; }

        // Touch 拦截（不用 overflow:hidden 的替代方案）
        function preventScroll(e) {
            // 允许弹窗内容滚动
            const box = document.querySelector('.modal-box');
            if (box && box.contains(e.target)) return;
            e.preventDefault();
        }

        closeBtn.addEventListener('click', function () {
            modal.classList.remove('active');

            // 移除 overflow:hidden（如果加了的话）
            document.documentElement.classList.remove('no-scroll');
            document.body.classList.remove('no-scroll');

            // 移除 touch 拦截（如果加了的话）
            document.removeEventListener('touchmove', preventScroll);

            // 恢复 backdrop-filter（如果移除了的话）
            modal.style.backdropFilter = '';
            modal.style.webkitBackdropFilter = '';

            log('弹窗已关闭 ← 请看地址栏！\n\n' + currentMode + '\n\n是否恢复通透？');
        });

        // 🔴 测试 A：有 overflow:hidden（当前 prompts 页行为）
        function testA() {
            currentMode = '🔴 模式 A：overflow:hidden + backdrop-filter';
            modal.classList.add('active');
            document.documentElement.classList.add('no-scroll');
            document.body.classList.add('no-scroll');
            document.getElementById('modalInfo').textContent = '有 overflow:hidden\n有 backdrop-filter';
            log('弹窗 A 已打开');
        }

        // 🟢 测试 B：无 overflow:hidden（只用 touch 拦截）
        function testB() {
            currentMode = '🟢 模式 B：纯 touch 拦截 + backdrop-filter';
            modal.classList.add('active');
            // 不加 overflow:hidden，改用 touch 拦截
            document.addEventListener('touchmove', preventScroll, { passive: false });
            document.getElementById('modalInfo').textContent = '无 overflow:hidden\n有 backdrop-filter\n（用 touch 拦截代替）';
            log('弹窗 B 已打开（无 overflow:hidden）');
        }

        // 🔵 测试 C：都不要
        function testC() {
            currentMode = '🔵 模式 C：纯 touch 拦截 + 无 backdrop-filter';
            modal.classList.add('active');
            modal.style.backdropFilter = 'none';
            modal.style.webkitBackdropFilter = 'none';
            document.addEventListener('touchmove', preventScroll, { passive: false });
            document.getElementById('modalInfo').textContent = '无 overflow:hidden\n无 backdrop-filter';
            log('弹窗 C 已打开（无 overflow:hidden + 无 blur）');
        }
    </script>
</body>

</html>
