<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>iOS Safari 黑块测试 v3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: #000000;
            min-height: 100%;
            overflow-x: hidden;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background-color: transparent;
            font-family: -apple-system, sans-serif;
            color: white;
        }

        html.no-scroll,
        body.no-scroll {
            overflow: hidden !important;
            overscroll-behavior: none !important;
        }

        /* 背景 blobs */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
        }

        .blob-1 {
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 80vh;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
        }

        .blob-2 {
            bottom: -15%;
            left: -10%;
            width: 55vw;
            height: 75vh;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
        }

        .blob-3 {
            top: 35%;
            left: 30%;
            width: 50vw;
            height: 70vh;
            background: linear-gradient(225deg, #db2777, #f59e0b);
        }

        /* 弹窗 */
        .test-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .test-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        .controls {
            position: relative;
            z-index: 1;
            padding: 60px 20px 40px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .hint {
            opacity: 0.6;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .section {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.5;
            margin: 18px 0 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin: 6px 0;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn.on {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
        }

        .status-bar {
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .close-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .filler {
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .filler-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="test-modal" id="modal">
        <div class="modal-box">
            <h2>测试弹窗</h2>
            <p style="margin:15px 0;opacity:0.7" id="modalInfo">标准模式</p>
            <button class="close-btn" onclick="closeModal()">关闭弹窗</button>
        </div>
    </div>

    <div class="controls">
        <h1>🔬 黑块诊断 v3</h1>
        <p class="hint">实时切换，无需刷新。观察底部地址栏变化。</p>

        <div class="section">html 背景色（关键！）</div>
        <button class="btn on" id="h1" onclick="setHtml('#000000')">⚫ html: #000000（当前）</button>
        <button class="btn" id="h2" onclick="setHtml('transparent')">🔵 html: transparent</button>
        <button class="btn" id="h3" onclick="setHtml('#0f172a')">🟣 html: #0f172a（深蓝灰）</button>

        <div class="section">body 背景色</div>
        <button class="btn on" id="b1" onclick="setBody('transparent')">🔵 body: transparent（当前）</button>
        <button class="btn" id="b2" onclick="setBody('inherit')">⚫ body: inherit</button>

        <div class="section">弹窗测试</div>
        <button class="btn" onclick="openModal()">打开弹窗（标准：overflow:hidden + blur）</button>

        <div class="status-bar" id="log">等待操作...</div>
    </div>

    <div class="filler">
        <div class="filler-card">卡片 1</div>
        <div class="filler-card">卡片 2</div>
        <div class="filler-card">卡片 3</div>
        <div class="filler-card">卡片 4</div>
        <div class="filler-card">卡片 5</div>
        <div class="filler-card">卡片 6</div>
        <div class="filler-card">卡片 7</div>
        <div class="filler-card">卡片 8</div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const logEl = document.getElementById('log');

        function log(msg) { logEl.textContent = msg; }

        function clearBtns(prefix) {
            document.querySelectorAll('[id^="' + prefix + '"]').forEach(b => b.classList.remove('on'));
        }

        function setHtml(color) {
            document.documentElement.style.setProperty('background-color', color, 'important');
            clearBtns('h');
            if (color === '#000000') document.getElementById('h1').classList.add('on');
            else if (color === 'transparent') document.getElementById('h2').classList.add('on');
            else document.getElementById('h3').classList.add('on');
            log('html 背景 → ' + color + ' | 看地址栏是否变化');
        }

        function setBody(color) {
            document.body.style.backgroundColor = color;
            clearBtns('b');
            if (color === 'transparent') document.getElementById('b1').classList.add('on');
            else document.getElementById('b2').classList.add('on');
            log('body 背景 → ' + color);
        }

        function openModal() {
            modal.classList.add('active');
            document.documentElement.classList.add('no-scroll');
            document.body.classList.add('no-scroll');
            log('弹窗已打开');
        }

        function closeModal() {
            modal.classList.remove('active');
            document.documentElement.classList.remove('no-scroll');
            document.body.classList.remove('no-scroll');
            log('弹窗已关闭 ← 看地址栏是否恢复');
        }
    </script>
</body>

</html>
