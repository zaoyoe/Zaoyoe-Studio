<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Z Logo Concepts - Solid & Structural</title>
<link href="css/logo-preview-grid-page.css?v=20260324_LOGO_PREVIEW_GRID_PAGE_STYLES_1" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet"/>
</head>
<body>
<h1>Solid & Structural Concepts</h1>
<div class="grid">
<!-- Variant 17: Negative Space Block -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect fill="white" height="80" rx="20" width="80" x="10" y="10"></rect>
<path d="M35 35 H65 L35 65 H65" stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
</svg>
<div class="label">Variant 17: Negative Space<br/>(负空间 - 块面感)</div>
</div>
<!-- Variant 18: Impossible Object (Penrose Z) -->
<div class="logo-item">
<svg fill="white" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M20 20 H80 L50 50 H80 V80 H20 L50 50 H20 V20 Z" opacity="0.9"></path>
<!-- Adding shadow for depth -->
<path d="M50 50 L80 50 L50 80 H20 L50 50" fill="black" opacity="0.3"></path>
</svg>
<div class="label">Variant 18: Origami Fold<br/>(折纸艺术)</div>
</div>
<!-- Variant 19: Bold Slab -->
<div class="logo-item">
<svg fill="white" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M15 20 H85 V35 H45 L85 75 V90 H15 V75 H55 L15 35 V20 Z"></path>
</svg>
<div class="label">Variant 19: Heavy Slab<br/>(极重衬线 - 力量感)</div>
</div>
<!-- Variant 20: Modern Ribbon -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="grad1" x1="0%" x2="100%" y1="0%" y2="100%">
<stop class="logo-preview-v6-inline-style-1" offset="0%"></stop>
<stop class="logo-preview-v6-inline-style-2" offset="100%"></stop>
</lineargradient>
</defs>
<path d="M25 25 H75 L25 75 H75" stroke="url(#grad1)" stroke-linecap="butt" stroke-linejoin="miter" stroke-width="12"></path>
</svg>
<div class="label">Variant 20: Gradient Ribbon<br/>(渐变丝带)</div>
</div>
</div>
</body>
</html>
