            return { heading, guide };
        }

        function openCaptchaInteractiveModal(data) {
            if (!captchaModal) return;

            // 若正处于成功完成过渡并即将关闭，禁止旧帧打断
            if (window.__captchaSuccessTransitioning) return;

            const isAlreadyOpen = (captchaModal.style.display === 'flex' || captchaFloatingPill?.style.display === 'flex');
            if (!isAlreadyOpen) {
                captchaSuccessNotified = false;
                localRefreshCount = 0;
                refreshCooldownSec = 0;
                updateRefreshBtnCooldown();
            }
            const hasImage = Boolean(data && data.image);
            const isNewImage = Boolean(hasImage && data.image !== currentCaptchaImageSrc);
            const incomingFrameSeq = (data && data.frameSeq !== undefined) ? Number(data.frameSeq) : 0;
            if (incomingFrameSeq && incomingFrameSeq < currentFrameSeq) return;
            const isNewFrame = Boolean(incomingFrameSeq && incomingFrameSeq > currentFrameSeq);
            const wasSubmitted = Boolean(window.__captchaSubmitted || window.__captchaPending);
            const wasLoading = !captchaContentReady;
            captchaContentReady = data?.contentReady !== false && !data?.loading;
            if (Number(data?.expiresAt) > 0) captchaExpiresAt = Number(data.expiresAt);

            if (incomingFrameSeq) {
                currentFrameSeq = Math.max(currentFrameSeq, incomingFrameSeq);
            }

            // 如果用户刚点击了提交/Next/刷新，且收到了全新画面（如多页验证跳转到第 2 页，或重试题目/换题），立即解封等待遮罩与交互锁
            if (wasSubmitted && (isNewImage || isNewFrame)) {
                window.__captchaSubmitted = false;
                window.__captchaPending = false;
                isClickLocked = false;
                clearTimeout(clickLockTimer);
                if (captchaSubmitOverlay) {
                    captchaSubmitOverlay.classList.remove('is-active');
                    captchaSubmitOverlay.style.display = 'none';
                }
                if (captchaSubmitSpinner) {
                    captchaSubmitSpinner.style.display = 'block';
                    captchaSubmitSpinner.style.opacity = '1';
                }
                if (captchaCheckmarkBox) {
                    captchaCheckmarkBox.classList.remove('is-visible');
                    captchaCheckmarkBox.style.display = 'none';
                }
            } else if (wasSubmitted && !isNewImage && !isNewFrame) {
                // 若仍在提交核验中且非新图像帧，保持遮罩并更新文字，不被空帧覆盖
                if (data && data.loading && captchaSubmitText) {
                    captchaSubmitText.textContent = '已提交验证，交由官方处理…';
                }
                return;
            }

            setCaptchaLoadingLayout(!captchaContentReady);
            if (data && data.image && captchaContentReady) {
                currentCaptchaImageSrc = data.image;
                isClickLocked = false;
                clearTimeout(clickLockTimer);
                refreshCooldownSec = 0;
                if (refreshCooldownTimer) {
                    clearInterval(refreshCooldownTimer);
                    refreshCooldownTimer = null;
                }
                updateRefreshBtnCooldown();
                if (data.promptEn) currentCaptchaPromptEn = data.promptEn;
                captchaInteractiveImg.src = data.image;
                captchaInteractiveImg.style.display = 'block';
                if (captchaLoadingState) captchaLoadingState.style.display = 'none';
                if (!window.__captchaSubmitted && !window.__captchaPending && captchaSubmitOverlay) {
                    captchaSubmitOverlay.style.display = 'none';
                    captchaSubmitOverlay.classList.remove('is-active');
                }
                if (captchaViewportContainer && (isNewImage || wasSubmitted)) {
                    captchaViewportContainer.querySelectorAll('.captcha-click-dot, .captcha-click-ripple, .captcha-select-badge').forEach(el => el.remove());
                }
                if (isNewImage || wasSubmitted) captchaSelectedPoints = [];
                window.__userCaptchaClicks = 0;
                if (!isAlreadyOpen || isNewImage || !captchaCountdownTimer) {
                    startCaptchaCountdown(60);
                }
                window.__captchaOpenProgress = taskProgressValue;
                if (wasSubmitted && (isNewImage || isNewFrame) && captchaStatusTip) {
                    captchaStatusTip.textContent = '官方画面已更新，请核对选中状态和按钮；多页题请继续完成下一页。';
                }
                if (wasLoading && captchaStatusTip) {
                    captchaStatusTip.textContent = '题图已完整加载，请按题目要求操作。';
                }
            } else if (data && (data.loading || data.contentReady === false)) {
                // 换题时展示明确的加载状态，不显示缺图截图或上一题的可操作画面。
                captchaInteractiveImg.style.display = 'none';
                if (captchaLoadingState) captchaLoadingState.style.display = 'flex';
                isClickLocked = false;
                clearTimeout(clickLockTimer);
                captchaSelectedPoints = [];
                if (captchaViewportContainer) {
                    captchaViewportContainer.querySelectorAll('.captcha-click-dot, .captcha-click-ripple, .captcha-select-badge').forEach(el => el.remove());
                }
                const replacingDrag = data.title === '正在更换题型…';
                if (captchaLoadingTitle) captchaLoadingTitle.textContent = replacingDrag ? data.title : '正在加载新题图片…';
                if (captchaLoadingText) captchaLoadingText.textContent = replacingDrag ? data.message : '图片完整显示后即可操作。加载较慢时可点击上方「换一题」。';
                if (captchaStatusTip) captchaStatusTip.textContent = replacingDrag ? '正在切换到点选题，请稍候。' : '系统正在自动更新题图，请稍候。';
                if (!captchaCountdownTimer) {
                    startCaptchaCountdown(60);
                }
            }

            const promptResolution = resolveCaptchaPromptAndGuide(data?.promptEn, data?.promptZh, data?.title, data?.message);
            const displayPrompt = promptResolution.heading;
            if (captchaPromptHeading) {
                captchaPromptHeading.textContent = displayPrompt;
            }
            if (captchaPromptDetail) {
                let html = '';
                if (data?.promptEn && data.promptEn !== displayPrompt) {
                    html += `<div class="captcha-prompt-en">英文原题：${escapeHtml(data.promptEn)}</div>`;
                }
                captchaPromptDetail.innerHTML = html;
            }

            if (!isAlreadyOpen && captchaFloatingPill) captchaFloatingPill.style.display = 'none';
            captchaModal.classList.remove('is-closing');
            captchaModal.style.display = 'flex';
            scheduleCaptchaScrollHint();
        }

        function minimizeCaptchaInteractiveModal() {
            if (captchaModal) captchaModal.style.display = 'none';
            if (captchaFloatingPill) captchaFloatingPill.style.display = 'flex';
            updateCaptchaScrollHint();
        }

        function restoreCaptchaInteractiveModal() {
            if (captchaFloatingPill) captchaFloatingPill.style.display = 'none';
            if (captchaModal) captchaModal.style.display = 'flex';
            scheduleCaptchaScrollHint();
        }

        function closeCaptchaInteractiveModal(force = false) {
            if (captchaScrollHint) captchaScrollHint.hidden = true;
            clearInterval(captchaCountdownTimer);
            captchaCountdownTimer = null;
            clearTimeout(captchaSuccessTimer);
            captchaSuccessTimer = null;
            clearTimeout(clickLockTimer);
            clickLockTimer = null;
            isClickLocked = false;
            localRefreshCount = 0;
            refreshCooldownSec = 0;
            if (refreshCooldownTimer) {
                clearInterval(refreshCooldownTimer);
                refreshCooldownTimer = null;
            }
            updateRefreshBtnCooldown();
            currentFrameSeq = 0;
            currentCaptchaImageSrc = '';
            captchaContentReady = true;
            captchaExpiresAt = 0;
            captchaSelectedPoints = [];
            if (captchaViewportContainer) {
                captchaViewportContainer.querySelectorAll('.captcha-select-badge').forEach(el => el.remove());
            }
            window.__userCaptchaClicks = 0;
            window.__captchaSubmitted = false;
            window.__captchaPending = false;
            window.__captchaSuccessTransitioning = false;
            if (!captchaModal || captchaModal.style.display === 'none') {
                if (captchaFloatingPill) captchaFloatingPill.style.display = 'none';
                setCaptchaLoadingLayout(false);
                captchaDialogHeight = 0;
                return;
            }

            const resetOverlays = () => {
                setCaptchaLoadingLayout(false);
                captchaDialogHeight = 0;
                if (captchaSubmitOverlay) {
                    captchaSubmitOverlay.style.display = 'none';
                    captchaSubmitOverlay.classList.remove('is-active');
                }
                if (captchaCheckmarkBox) {
                    captchaCheckmarkBox.classList.remove('is-visible');
                    captchaCheckmarkBox.style.display = 'none';
                }
                if (captchaSubmitSpinner) {
                    captchaSubmitSpinner.style.display = 'block';
                    captchaSubmitSpinner.style.opacity = '1';
                }
            };

            if (force) {
                captchaModal.classList.remove('is-closing');
                captchaModal.style.display = 'none';
                if (captchaFloatingPill) captchaFloatingPill.style.display = 'none';
                resetOverlays();
                return;
            }

            // 触发丝滑关闭消失过渡动画 (300ms)
            captchaModal.classList.add('is-closing');
            setTimeout(() => {
                captchaModal.classList.remove('is-closing');
                captchaModal.style.display = 'none';
                if (captchaFloatingPill) captchaFloatingPill.style.display = 'none';
                resetOverlays();
            }, 300);
        }

        function createCaptchaClickMarker(x, y) {
            if (!captchaViewportContainer) return;
            const ripple = document.createElement('div');
            ripple.className = 'captcha-click-ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;

            const dot = document.createElement('div');
            dot.className = 'captcha-click-dot';
            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;

            captchaViewportContainer.appendChild(ripple);
            captchaViewportContainer.appendChild(dot);

            setTimeout(() => {
                ripple.remove();
                dot.remove();
            }, 1200);
        }

        function showCaptchaPendingTransition(customText) {
            if (!captchaSubmitOverlay) return;
            window.__captchaSubmitted = true;
            window.__captchaPending = true;
            captchaLastSubmitTs = Date.now();

            captchaSubmitOverlay.style.display = 'flex';
            requestAnimationFrame(() => {
                captchaSubmitOverlay.classList.add('is-active');
            });

            if (captchaSubmitSpinner) {
                captchaSubmitSpinner.style.display = 'block';
                captchaSubmitSpinner.style.opacity = '1';
            }
            if (captchaCheckmarkBox) {
                captchaCheckmarkBox.classList.remove('is-visible');
                captchaCheckmarkBox.style.display = 'none';
            }
            if (captchaSubmitText) {
                captchaSubmitText.textContent = customText || '已提交操作，正在同步官方收银台…';
                captchaSubmitText.style.display = 'block';
            }
            if (captchaStatusTip) {
                captchaStatusTip.textContent = '';
            }
        }

        function showCaptchaSubmitTransition() {
            showCaptchaPendingTransition();
        }

        function showCaptchaSuccessTransition() {
            if (window.__captchaSuccessTransitioning || captchaSuccessNotified) return;
            captchaSuccessNotified = true;
            closeCaptchaInteractiveModal(false);
            window.__captchaSuccessTransitioning = true;
            // 弹窗退场后使用独立胶囊提示，不在充值卡片或验证弹窗内展开成功文案。
            captchaSuccessTimer = setTimeout(() => {
                captchaSuccessTimer = null;
                window.__captchaSuccessTransitioning = false;
                showCapsule('安全验证已通过，系统正在继续执行支付…', 'success', 2800);
            }, 300);
        }

        let captchaPointerDownData = null;

        function handleCaptchaImageDrag(start, e) {
            if (!activeJobKey) return;
            if (window.__captchaSubmitted || window.__captchaPending || isClickLocked) return;
            if (!captchaContentReady) return;
            if (!captchaInteractiveImg || !captchaInteractiveImg.src || captchaInteractiveImg.style.display === 'none') return;

            // 拖拽手势发送后立即锁定 1200ms，等待后端执行响应与新帧
            isClickLocked = true;
            clearTimeout(clickLockTimer);
            clickLockTimer = setTimeout(() => {
                isClickLocked = false;
            }, 1200);

            const fromX = start.startX - start.rectLeft;
            const fromY = start.startY - start.rectTop;
            const toX = e.clientX - start.rectLeft;
            const toY = e.clientY - start.rectTop;

            const fromRatioX = Math.max(0, Math.min(1, fromX / start.rectWidth));
            const fromRatioY = Math.max(0, Math.min(1, fromY / start.rectHeight));
            const toRatioX = Math.max(0, Math.min(1, toX / start.rectWidth));
            const toRatioY = Math.max(0, Math.min(1, toY / start.rectHeight));

            if (captchaViewportContainer) {
                const containerRect = captchaViewportContainer.getBoundingClientRect();
                createCaptchaClickMarker(start.startX - containerRect.left, start.startY - containerRect.top);
                createCaptchaClickMarker(e.clientX - containerRect.left, e.clientY - containerRect.top);
            }

            if (captchaStatusTip) {
                captchaStatusTip.textContent = '已发送拖拽操作，正在模拟移动…';
            }

            const payload = {
                action: 'captcha_drag',
                type: 'captcha_drag',
                jobKey: activeJobKey,
                fromRatioX,
                fromRatioY,
                toRatioX,
                toRatioY,
                frameSeq: currentFrameSeq,
                timestamp: Date.now()
            };

            let sentViaWs = false;
            if (socket && socket.readyState === WebSocket.OPEN) {
                try {
                    socket.send(JSON.stringify(payload));
                    sentViaWs = true;
                } catch (_) {}
            }

            if (!sentViaWs && activeJobKey) {
                fetch(`/api/public/task/${encodeURIComponent(activeJobKey)}/captcha-drag`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => {});
            }
        }

        let localRefreshCount = 0;
        let refreshCooldownSec = 0;
        let refreshCooldownTimer = null;

        function updateRefreshBtnCooldown() {
            if (!captchaHeaderRefreshBtn) return;
            if (refreshCooldownSec > 0) {
                captchaHeaderRefreshBtn.classList.add('disabled');
                const span = captchaHeaderRefreshBtn.querySelector('span');
                if (span) span.textContent = `换一题 (${refreshCooldownSec}s)`;
            } else {
                captchaHeaderRefreshBtn.classList.remove('disabled');
                const span = captchaHeaderRefreshBtn.querySelector('span');
                if (span) span.textContent = '换一题';
            }
        }

        function triggerCaptchaRefresh(ratioX = 0.31, ratioY = 0.93) {
            if (refreshCooldownSec > 0) {
                showCapsule(`换题中，请稍候 ${refreshCooldownSec} 秒...`, 'info', 1200);
                return;
            }
            if (isClickLocked) {
                showCapsule('正在同步操作中，请稍候…', 'info', 1200);
                return;
            }
            localRefreshCount += 1;

            // 清空本地所有勾选标记
            captchaSelectedPoints = [];
            if (captchaViewportContainer) {
                captchaViewportContainer.querySelectorAll('.captcha-select-badge').forEach(el => el.remove());
            }

            // 按钮冷却 2 秒防连击，换题无次数上限。
            refreshCooldownSec = 2;
            updateRefreshBtnCooldown();
            clearInterval(refreshCooldownTimer);
            refreshCooldownTimer = setInterval(() => {
                refreshCooldownSec -= 1;
                updateRefreshBtnCooldown();
                if (refreshCooldownSec <= 0) {
                    clearInterval(refreshCooldownTimer);
                }
            }, 1000);

            // 换题期间显示有说明的加载状态。
            if (captchaStatusTip) {
                captchaStatusTip.textContent = `⟳ 正在向官方申请更换题目 (第 ${localRefreshCount} 次)，请稍候…`;
            }
            isClickLocked = true;
            clearTimeout(clickLockTimer);
            clickLockTimer = setTimeout(() => { isClickLocked = false; }, 2000);
            captchaContentReady = false;
            setCaptchaLoadingLayout(true);
            captchaInteractiveImg.style.display = 'none';
            if (captchaLoadingState) captchaLoadingState.style.display = 'flex';
            if (captchaLoadingTitle) captchaLoadingTitle.textContent = '正在请求新题…';
            if (captchaLoadingText) captchaLoadingText.textContent = '等待官方题图完整加载后即可继续操作。';

            const payload = {
                type: 'captcha_click',
                action: 'refresh',
                jobKey: activeJobKey,
                ratioX: Number(ratioX) || 0.31,
                ratioY: Number(ratioY) || 0.93,
                frameSeq: currentFrameSeq
            };

            let sentViaWs = false;
            if (socket && socket.readyState === WebSocket.OPEN) {
                try {
                    socket.send(JSON.stringify(payload));
                    sentViaWs = true;
                } catch (_) {}
            }

            if (!sentViaWs && activeJobKey) {
                fetch(`/api/public/task/${encodeURIComponent(activeJobKey)}/captcha-click`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(response => response.json())
                    .then(data => handleCaptchaClickReceived({ ...data, handled: data.success === true && data.handled === true }))
                    .catch(() => handleCaptchaClickReceived({ handled: false }));
            }

        }

        function handleCaptchaImageClick(e) {
            if (!activeJobKey) return;
            if (window.__captchaSubmitted || window.__captchaPending || isClickLocked) return;
            if (!captchaInteractiveImg || !captchaInteractiveImg.src || captchaInteractiveImg.style.display === 'none') return;

            const now = Date.now();
            if (now - captchaLastClickTs < 120) {
                return;
            }
            captchaLastClickTs = now;

            const rect = captchaInteractiveImg.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            if (clickX < 0 || clickY < 0 || clickX > rect.width || clickY > rect.height) {
                return;
            }

            const ratioX = clickX / rect.width;
            const ratioY = clickY / rect.height;

            const isSubmitClick = (ratioY > 0.78 && ratioX >= 0.58);
            const isRefreshClick = (ratioY > 0.78 && ratioX <= 0.44);

            if (!captchaContentReady && !isRefreshClick) {
                if (captchaStatusTip) captchaStatusTip.textContent = '题图仍在加载，画面就绪后再操作；也可点击「换一题」。';
                return;
            }

            if (isSubmitClick) {
                // 用户点击右下角「Verify / 提交」或「Next / 下一步」：
                // 一次性打包当前所有已勾选目标坐标 + 提交按钮坐标回传云端
                const selectedCount = captchaSelectedPoints.length;
                if (selectedCount > 0) {
                    showCaptchaPendingTransition(`已选 ${selectedCount} 项，正在同步官方收银台…`);
                } else {
                    showCaptchaPendingTransition('已提交操作，正在同步官方收银台…');
                }
                isClickLocked = true;

                const payload = {
                    type: 'captcha_click',
                    action: 'submit',
                    jobKey: activeJobKey,
                    ratioX,
                    ratioY,
                    points: captchaSelectedPoints.map(p => ({ ratioX: p.ratioX, ratioY: p.ratioY })),
                    submitPoint: { ratioX, ratioY },
                    frameSeq: currentFrameSeq
                };

                let sentViaWs = false;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    try {
                        socket.send(JSON.stringify(payload));
                        sentViaWs = true;
                    } catch (_) {}
                }

                if (!sentViaWs && activeJobKey) {
                    fetch(`/api/public/task/${encodeURIComponent(activeJobKey)}/captcha-click`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }).then(response => response.json())
                        .then(data => handleCaptchaClickReceived({ ...data, handled: data.success === true && data.handled === true }))
                        .catch(() => handleCaptchaClickReceived({ handled: false }));
                }

            } else if (isRefreshClick) {
                triggerCaptchaRefresh(ratioX, ratioY);
            } else {
                // 核心交互升级：普通选图点击 —— 本地即时勾选/取消勾选，0 网络往返，绝不卡顿！
                const containerRect = captchaViewportContainer ? captchaViewportContainer.getBoundingClientRect() : rect;
                const containerClickX = e.clientX - containerRect.left;
                const containerClickY = e.clientY - containerRect.top;

                // 距离判定：若点击位置与已有选中点欧氏距离小于约 0.08（一个格子的半径），则视为取消该格子的勾选
                const existingIdx = captchaSelectedPoints.findIndex(pt => Math.hypot(pt.ratioX - ratioX, pt.ratioY - ratioY) < 0.08);
                if (existingIdx !== -1) {
                    // 取消已有勾选
                    const removed = captchaSelectedPoints.splice(existingIdx, 1)[0];
                    if (removed && removed.badgeEl) {
                        removed.badgeEl.style.transform = 'translate(-50%, -50%) scale(0.2)';
                        removed.badgeEl.style.opacity = '0';
                        setTimeout(() => removed.badgeEl.remove(), 180);
                    }
                    if (captchaStatusTip) {
                        captchaStatusTip.textContent = captchaSelectedPoints.length > 0
                            ? '点击已选图片可取消勾选；确认无误后，请点击右下角「skip/Verify」 提交验证。'
                            : '请在下方点选所有符合条件的图片；确认无误后，请点击右下角「skip/Verify」 提交验证。';
                    }
                } else {
                    // 新增勾选标
                    const badgeEl = document.createElement('div');
                    badgeEl.className = 'captcha-select-badge';
                    badgeEl.style.left = `${containerClickX}px`;
                    badgeEl.style.top = `${containerClickY}px`;
                    badgeEl.innerHTML = '✓';
                    if (captchaViewportContainer) {
                        captchaViewportContainer.appendChild(badgeEl);
                        createCaptchaClickMarker(containerClickX, containerClickY);
                    }

                    captchaSelectedPoints.push({
                        ratioX,
                        ratioY,
                        clientX: clickX,
                        clientY: clickY,
                        badgeEl
                    });

                    if (captchaStatusTip) {
                        captchaStatusTip.textContent = '点击已选图片可取消勾选；确认无误后，请点击右下角「skip/Verify」 提交验证。';
                    }
                }
            }
        }

        if (captchaInteractiveImg) {
            captchaInteractiveImg.addEventListener('pointerdown', (e) => {
                if (!activeJobKey) return;
                if (window.__captchaSubmitted || window.__captchaPending || isClickLocked) return;
                const rect = captchaInteractiveImg.getBoundingClientRect();
                captchaPointerDownData = {
                    startX: e.clientX,
                    startY: e.clientY,
                    rectLeft: rect.left,
                    rectTop: rect.top,
                    rectWidth: rect.width,
                    rectHeight: rect.height,
                    time: Date.now()
                };
            });

            captchaInteractiveImg.addEventListener('pointerup', (e) => {
                if (!captchaPointerDownData) return;
                if (window.__captchaSubmitted || window.__captchaPending || isClickLocked) {
                    captchaPointerDownData = null;
                    return;
                }
                const start = captchaPointerDownData;
                captchaPointerDownData = null;

                const deltaX = e.clientX - start.startX;
                const deltaY = e.clientY - start.startY;
                const dist = Math.hypot(deltaX, deltaY);

                if (dist > 15) {
                    handleCaptchaImageDrag(start, e);
                } else {
                    handleCaptchaImageClick(e);
                }
            });
            captchaInteractiveImg.addEventListener('pointercancel', () => { captchaPointerDownData = null; });
        }
        if (captchaModalCloseBtn) {
            captchaModalCloseBtn.addEventListener('click', minimizeCaptchaInteractiveModal);
        }
        if (captchaHeaderRefreshBtn) {
            captchaHeaderRefreshBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                triggerCaptchaRefresh(0.31, 0.93);
            });
        }
        if (captchaFloatingPill) {
            captchaFloatingPill.addEventListener('click', restoreCaptchaInteractiveModal);
        }

        function handleCaptchaInteractiveRequired(data) {
            openCaptchaInteractiveModal(data);
        }

        function handleCaptchaClickReceived(data) {
            if (data?.handled === false) {
                window.__captchaSubmitted = false;
                window.__captchaPending = false;
                isClickLocked = false;
                clearTimeout(clickLockTimer);
                if (captchaSubmitOverlay) {
                    captchaSubmitOverlay.style.display = 'none';
                    captchaSubmitOverlay.classList.remove('is-active');
                }
                if (captchaStatusTip) captchaStatusTip.textContent = '画面已更新或验证会话已结束，本次操作未执行；请等待最新画面后重新操作。';
                return;
            }
            // 接收回执只确认传输状态，不覆盖加载或选图反馈。
        }

        function handleCaptchaInteractiveStatus(data) {
            if (data && data.cleared) {
                showCaptchaSuccessTransition();
            } else if (data && data.failed) {
                // 官方明确拦截或失败熔断
                closeCaptchaInteractiveModal(true);
            }
            // 注意：中间轮次 cleared: false 不关闭弹窗，等待新题帧到达或任务终态关闭
        }

        function initWebSocket(jobKey) {
            if (!jobKey) {
                return;
            }

            activeJobKey = jobKey;

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'subscribe', jobKey }));
                return;
            }
            if (socket && socket.readyState === WebSocket.CONNECTING) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                clearTimeout(reconnectTimer);
                socket.send(JSON.stringify({ type: 'subscribe', jobKey: activeJobKey }));
                startSocketHeartbeat();
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'pong') {
                        scheduleSocketHeartbeatTimeout();
                        return;
                    }
                    if (data.jobKey && activeJobKey && data.jobKey !== activeJobKey) {
                        return;
                    }
                    scheduleSocketHeartbeatTimeout();
                    if (data.type === 'snapshot' || data.type === 'progress' || data.type === 'status') {
                        applyTaskState(data);
                    } else if (data.type === 'captcha_interactive_required') {
                        handleCaptchaInteractiveRequired(data);
                    } else if (data.type === 'captcha_click_received') {
                        handleCaptchaClickReceived(data);
                    } else if (data.type === 'captcha_interactive_status') {
                        handleCaptchaInteractiveStatus(data);
                    }
                } catch (e) {
                    console.error('WS Message Error:', e);
                }
            };

            socket.onclose = () => {
                clearSocketHeartbeat();
                socket = null;
                if (activeJobKey && !taskCompleted) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(() => initWebSocket(activeJobKey), 3000);
                }
            };

            socket.onerror = (error) => {
                console.error('WebSocket Error:', error);
            };
        }

        startBtn.addEventListener('click', async () => {
            const rawSession = tokenInput.value.trim();
            const sessionCheck = validateSessionInput(rawSession);
            if (!sessionCheck.session) return showStatus(sessionCheck.message || '请粘贴完整 Session JSON', 'error');
            if (!verifiedCdk) return showStatus('请先验证 CDK', 'error');
            if (!sessionCheck.valid) {
                return showStatus(sessionCheck.message, 'error');
            }

            setButtonText(startBtn, START_PENDING_TEXT);
            toggleLoading(startBtn, true, { keepTextVisible: true });
            startBtn.disabled = true;
            setActivationLock(true);
            taskCompleted = false;
            activeJobKey = '';
            clearTimeout(reconnectTimer);

            if (!pageShell?.dataset?.topLocked) {
                lockShellTopPosition();
            }
            statusMsg.style.display = 'none';
            resetProgressState();
            showProgress();
            if (sessionCheck.email) {
                window.__taskCurrentEmail = sessionCheck.email;
            }
            const initLabel = window.__taskCurrentEmail
                ? `正在为账号 ${window.__taskCurrentEmail} 准备开通...`
                : '';
            setProgress(3, initLabel, 'running', { force: true });
            updateFlowUI(2, 'running');

            try {
                const response = await fetch('/api/run-process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        platform: currentPlatform,
                        session: sessionCheck.session,
                        cdk: verifiedCdk
                    })
                });
                const data = await response.json();

                if (data.success && data.jobKey) {
                    setProgress(8, '', 'running');
                    initWebSocket(data.jobKey);
                } else {
                    hideProgress();
                    updateFlowUI(2, 'failed');
                    showStatus(formatTaskErrorMessage('failed', data.message, data), 'error');
                    setButtonText(startBtn, START_FAILED_TEXT);
                    toggleLoading(startBtn, false);
                    startBtn.disabled = false;
                    setActivationLock(false);
                }
            } catch (error) {
                hideProgress();
                updateFlowUI(2, 'failed');
                showStatus('网络连接失败，请重试', 'error');
                setButtonText(startBtn, START_FAILED_TEXT);
                toggleLoading(startBtn, false);
                startBtn.disabled = false;
                setActivationLock(false);
            }
        });

        function toggleLoading(btn, isLoading, options = {}) {
            const keepTextVisible = Boolean(options.keepTextVisible);
            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.loader');
            btn.disabled = isLoading;
            btn.classList.toggle('is-loading', isLoading && keepTextVisible);
            if (text) {
                text.style.display = isLoading && !keepTextVisible ? 'none' : 'block';
            }
            if (loader) {
                loader.style.display = isLoading ? 'block' : 'none';
            }
        }

        function setButtonText(btn, content) {
            const text = btn.querySelector('.btn-text');
            if (text) {
                if (typeof content === 'string' && content.includes('<')) {
                    text.innerHTML = content;
                } else {
                    text.textContent = content;
                }
            }
        }

        function resetProgressState() {
            clearTimeout(successTransitionTimer);
            clearTimeout(successNoticeTimer);
            taskProgressValue = 0;
            if (taskProgressBar) {
                taskProgressBar.style.width = '0%';
                taskProgressBar.classList.remove('error', 'warning');
            }
            if (taskProgressPercent) taskProgressPercent.textContent = '0%';
            if (taskProgressText) {
                taskProgressText.textContent = '';
            }
            if (startBtnProgress) {
                startBtnProgress.style.width = '0%';
                startBtnProgress.classList.remove('error', 'warning');
            }
            if (startBtn) {
                startBtn.classList.remove('is-running', 'is-success', 'is-error');
            }
        }

        function showProgress() {
            // 进度条已直接集成在充值按钮内部，底部的独立进度框永久隐藏，仅保留 statusMessage
            if (taskProgress) taskProgress.style.display = 'none';
        }

        function hideProgress() {
            if (taskProgress) taskProgress.style.display = 'none';
            resetProgressState();
        }

        function setProgress(percent, label = '', type = 'running', options = {}) {
            const force = Boolean(options.force);
            const maxAllowed = (type === 'success' || type === 'error' || type === 'warning') ? 100 : 99;
            const requested = Math.max(0, Math.min(maxAllowed, Math.round(percent)));
            const next = (!force && requested < taskProgressValue) ? taskProgressValue : requested;
            taskProgressValue = next;
            if (taskProgressBar) taskProgressBar.style.width = `${next}%`;
            if (taskProgressPercent) taskProgressPercent.textContent = `${next}%`;
            if (taskProgressText) {
                taskProgressText.textContent = label || '';
            }
            if (taskProgressBar) {
                taskProgressBar.classList.toggle('error', type === 'error');
                taskProgressBar.classList.toggle('warning', type === 'warning');
            }

            // 同步更新充值按钮内置进度条与状态
            if (startBtnProgress) {
                startBtnProgress.style.width = `${next}%`;
                startBtnProgress.classList.toggle('error', type === 'error');
                startBtnProgress.classList.toggle('warning', type === 'warning');
            }

            if (type === 'running') {
                clearTimeout(successTransitionTimer);
                startBtn.classList.add('is-running');
                startBtn.classList.remove('is-success', 'is-error');
            } else if (type === 'success') {
                // 1. 进度条充满到 100%
                if (startBtnProgress) {
                    startBtnProgress.style.width = '100%';
                }
                clearTimeout(successTransitionTimer);
                clearTimeout(successNoticeTimer);

                const triggerSuccessNotice = () => {
                    const msg = options.successMessage;
                    if (msg) {
                        showStatus(msg, 'success');
                    }
                };

                if (options.immediate) {
                    startBtn.classList.remove('is-running');
                    startBtn.classList.add('is-success');
                    toggleLoading(startBtn, false);
                    setButtonText(startBtn, START_SUCCESS_TEXT);
                    startBtn.disabled = true;

                    // 对号绘制用时约 500ms (120ms 延时 + 380ms 绘制)，对号完全成型后再展示成功提示
                    successNoticeTimer = setTimeout(triggerSuccessNotice, 520);
                } else {
                    // 保持运行态，让用户清晰看到进度条已充满整个按钮
                    startBtn.classList.add('is-running');
                    startBtn.classList.remove('is-success', 'is-error');

                    // 2. 进度条充满后微停一下 (约 500ms)，再丝滑过度到纯色完成态与居中对号
                    successTransitionTimer = setTimeout(() => {
                        startBtn.classList.remove('is-running');
                        startBtn.classList.add('is-success');
                        toggleLoading(startBtn, false);
                        setButtonText(startBtn, START_SUCCESS_TEXT);
                        startBtn.disabled = true;

                        // 对号完全成型后，再平滑向下展开成功提示
                        successNoticeTimer = setTimeout(triggerSuccessNotice, 520);
                    }, 500);
                }
            } else if (type === 'error') {
                clearTimeout(successTransitionTimer);
                startBtn.classList.remove('is-running', 'is-success');
                startBtn.classList.add('is-error');
                if (startBtnProgress) {
                    startBtnProgress.style.width = '0%';
                }
            }

            // 充值进行中不展示过程任务说明，仅在失败或非 running 态时若有 label 才展示
            if (label && type !== 'running') {
                showStatus(label, type);
            }
        }

        function showStatus(message, type = 'error') {
            statusMsg.innerHTML = message;
            let statusClass = 'status-error';
            if (type === 'success') statusClass = 'status-success';
            else if (type === 'warning' || type === 'manual') statusClass = 'status-warning';
            statusMsg.className = `status-message ${statusClass}`;

            lockShellTopPosition();
            morphCardHeight(() => {
                statusMsg.style.display = 'block';
            });
        }

        const capsuleToast = document.getElementById('capsuleToast');
        let capsuleTimer = null;
        let capsuleHideTimer = null;

        function showCapsule(message, type = 'error', duration = 2800) {
            if (!capsuleToast) return;
            clearTimeout(capsuleTimer);
            clearTimeout(capsuleHideTimer);

            capsuleToast.className = `capsule-toast capsule-${type}`;
            capsuleToast.classList.remove('is-hiding');

            const iconSvg = type === 'success'
                ? '<svg class="capsule-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg>'
                : '<svg class="capsule-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';

            capsuleToast.innerHTML = `${iconSvg}<span>${message}</span>`;
            capsuleToast.style.display = 'inline-flex';

            capsuleToast.classList.remove('shake');
            capsuleToast.style.animation = 'none';
            void capsuleToast.offsetWidth;
            capsuleToast.style.animation = '';
            if (type === 'error') capsuleToast.classList.add('shake');

            capsuleTimer = setTimeout(() => {
                capsuleToast.classList.add('is-hiding');
                capsuleHideTimer = setTimeout(() => {
                    capsuleToast.style.display = 'none';
                    capsuleToast.classList.remove('is-hiding', 'shake');
                }, 240);
            }, duration);

            capsuleToast.onclick = () => {
                clearTimeout(capsuleTimer);
                clearTimeout(capsuleHideTimer);
                capsuleToast.classList.add('is-hiding');
                capsuleHideTimer = setTimeout(() => {
                    capsuleToast.style.display = 'none';
                    capsuleToast.classList.remove('is-hiding', 'shake');
                }, 240);
            };
        }

        updateFlowUI(1, 'pending');
        window.lucide?.createIcons();

        // 核心秘钥同款：鼠标移动视差浮动交互 (Mouse Parallax Interaction)
        window.addEventListener('mousemove', (event) => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const x = ((event.clientX / window.innerWidth) - 0.5) * 36;
            const y = ((event.clientY / window.innerHeight) - 0.5) * 24;
            document.documentElement.style.setProperty('--pointer-x', `${x.toFixed(1)}px`);
            document.documentElement.style.setProperty('--pointer-y', `${y.toFixed(1)}px`);
        }, { passive: true });

        window.addEventListener('mouseleave', () => {
            document.documentElement.style.setProperty('--pointer-x', '0px');
            document.documentElement.style.setProperty('--pointer-y', '0px');
        });

        // ============ 亮暗主题切换与持久化 (Theme Management) ============
        (function initTheme() {
            const THEME_KEY = 'fk-theme';
            const toggleBtn = document.getElementById('themeToggleBtn');

            function getPreferredTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'light' || saved === 'dark') {
                    return saved;
                }
                return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                document.body.setAttribute('data-theme', theme);
                localStorage.setItem(THEME_KEY, theme);
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            }

            // 初始化当前主题
            const currentTheme = getPreferredTheme();
            applyTheme(currentTheme);

            // 切换按钮点击交互
            toggleBtn?.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                const nextTheme = current === 'light' ? 'dark' : 'light';
                applyTheme(nextTheme);
            });

            // 跟随系统主题动态变化 (用户未手动设置时跟随系统偏好)
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
                    if (!localStorage.getItem(THEME_KEY)) {
                        applyTheme(e.matches ? 'light' : 'dark');
                    }
                });
            }
        })();

        // ============ 输入框/文本域滚动条自动显隐 (Hide scrollbar when idle) ============
        (function initScrollbarAutoHide() {
            const bindScrollEvents = () => {
                document.querySelectorAll('textarea, input').forEach(el => {
                    if (el.dataset.scrollbarBound) return;
                    el.dataset.scrollbarBound = 'true';
                    let scrollTimer = null;
                    el.addEventListener('scroll', () => {
                        el.classList.add('is-scrolling');
                        clearTimeout(scrollTimer);
                        scrollTimer = setTimeout(() => {
                            el.classList.remove('is-scrolling');
                        }, 750);
                    }, { passive: true });
                });
            };
            bindScrollEvents();
            window.addEventListener('DOMContentLoaded', bindScrollEvents);
        })();
    </script>
</body>
