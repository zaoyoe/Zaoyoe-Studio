<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Logo Concepts</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 50px;
        }

        .logo-container {
            display: flex;
            gap: 80px;
            align-items: center;
        }

        .logo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .label {
            font-family: 'Inter', sans-serif;
            color: #888;
            font-size: 14px;
        }

        svg {
            width: 60px;
            height: 60px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Logo Concepts</h1>
    <div class="logo-container">
        <!-- Option 1: Elegant Serif Z (Matches Site) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- A high-contrast Z with a swash -->
                <path d="M25 25H75L35 75H80" stroke="white" stroke-width="8" stroke-linecap="square"
                    stroke-linejoin="miter" />
                <!-- Adding a subtle accent -->
                <circle cx="78" cy="22" r="5" fill="#fff" />
            </svg>
            <div class="label">Option 1: Minimalist</div>
        </div>

        <!-- Option 2: Interlocking/Abstract Z -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="white" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20 H80 V35 H45 L80 75 V90 H20 V75 H55 L20 35 V20 Z" />
            </svg>
            <div class="label">Option 2: Geometric Block</div>
        </div>

        <!-- Option 3: Stylized Curve Z (Luxury) -->
        <div class="logo-item">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 18C16 18 48 18 48 18C52 18 54 22 50 26L14 54C10 58 12 62 18 62H52" stroke="white"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="label">Option 3: Fluid Curve</div>
        </div>

        <!-- Option 4: Double Z (Zaoyoe Style) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 30 H80 L20 90 H80" stroke="white" stroke-width="4" stroke-linecap="butt" />
                <path d="M25 25 H75 L25 85 H75" stroke="white" stroke-width="1" stroke-opacity="0.5" />
            </svg>
            <div class="label">Option 4: Offset Shadow</div>
        </div>
    </div>
</body>

</html>
