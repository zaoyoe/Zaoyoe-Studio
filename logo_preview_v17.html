<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Z Logo Concepts - Quantum Dash Grey</title>
<link href="css/logo-preview-grid-page.css?v=20260324_LOGO_PREVIEW_GRID_PAGE_STYLES_1" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet"/>
</head>
<body>
<h1>Quantum Dash - Grey Middle (Set 17)</h1>
<div class="grid">
<!-- Variant 61: Silver/Light Grey -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Top -->
<path d="M30 20 H80 L70 35 H20 Z" fill="white"></path>
<!-- Middle (Silver) -->
<path d="M40 40 H90 L80 55 H30 Z" fill="#ccc"></path>
<!-- Bottom -->
<path d="M20 60 H70 L60 75 H10 Z" fill="white"></path>
<!-- Shadows -->
<path d="M80 20 L90 15 L80 30" fill="#333"></path>
<path d="M90 40 L100 35 L90 50" fill="#333"></path>
<path d="M70 60 L80 55 L70 70" fill="#333"></path>
</svg>
<div class="label">Variant 61: Silver<br/>(银色中段)</div>
</div>
<!-- Variant 62: Medium Grey -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Top -->
<path d="M30 20 H80 L70 35 H20 Z" fill="white"></path>
<!-- Middle (Medium Grey) -->
<path d="M40 40 H90 L80 55 H30 Z" fill="#888"></path>
<!-- Bottom -->
<path d="M20 60 H70 L60 75 H10 Z" fill="white"></path>
<!-- Shadows -->
<path d="M80 20 L90 15 L80 30" fill="#333"></path>
<path d="M90 40 L100 35 L90 50" fill="#333"></path>
<path d="M70 60 L80 55 L70 70" fill="#333"></path>
</svg>
<div class="label">Variant 62: Iron<br/>(铁灰中段)</div>
</div>
<!-- Variant 63: Dark Grey (Stealth) -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Top -->
<path d="M30 20 H80 L70 35 H20 Z" fill="white"></path>
<!-- Middle (Dark Grey) -->
<path d="M40 40 H90 L80 55 H30 Z" fill="#444"></path>
<!-- Bottom -->
<path d="M20 60 H70 L60 75 H10 Z" fill="white"></path>
<!-- Shadows -->
<path d="M80 20 L90 15 L80 30" fill="#333"></path>
<path d="M90 40 L100 35 L90 50" fill="#222"></path> <!-- Darker shadow for dark body -->
<path d="M70 60 L80 55 L70 70" fill="#333"></path>
</svg>
<div class="label">Variant 63: Stealth<br/>(深灰中段)</div>
</div>
<!-- Variant 64: Metallic Gradient -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="metalGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop class="logo-preview-v17-inline-style-1" offset="0%"></stop>
<stop class="logo-preview-v17-inline-style-2" offset="50%"></stop>
<stop class="logo-preview-v17-inline-style-1" offset="100%"></stop>
</lineargradient>
</defs>
<!-- Top -->
<path d="M30 20 H80 L70 35 H20 Z" fill="white"></path>
<!-- Middle (Gradient) -->
<path d="M40 40 H90 L80 55 H30 Z" fill="url(#metalGrad)"></path>
<!-- Bottom -->
<path d="M20 60 H70 L60 75 H10 Z" fill="white"></path>
<!-- Shadows -->
<path d="M80 20 L90 15 L80 30" fill="#333"></path>
<path d="M90 40 L100 35 L90 50" fill="#333"></path>
<path d="M70 60 L80 55 L70 70" fill="#333"></path>
</svg>
<div class="label">Variant 64: Metallic<br/>(金属光泽)</div>
</div>
</div>
</body>
</html>
