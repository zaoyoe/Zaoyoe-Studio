<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Z Logo Concepts - Origami Variations</title>
<link href="css/logo-preview-grid-page.css?v=20260324_LOGO_PREVIEW_GRID_PAGE_STYLES_1" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet"/>
</head>
<body>
<h1>Origami Variations</h1>
<div class="grid">
<!-- Variant 21: Classic Fold (The selected one) -->
<div class="logo-item">
<svg fill="white" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M20 20 H80 L50 50 H80 V80 H20 L50 50 H20 V20 Z" opacity="0.9"></path>
<path d="M50 50 L80 50 L50 80 H20 L50 50" fill="black" opacity="0.3"></path>
</svg>
<div class="label">Variant 21: Classic Fold<br/>(经典折叠 - 原版)</div>
</div>
<!-- Variant 22: Dimensional Ribbon (Thick Fold) -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Top segment -->
<path d="M20 25 H70 L50 50 H20 V25 Z" fill="#fff" opacity="0.9"></path>
<!-- Bottom segment -->
<path d="M80 75 H30 L50 50 H80 V75 Z" fill="#fff" opacity="0.9"></path>
<!-- Connecting Diagonal (Darker for depth) -->
<path d="M70 25 L30 75 L50 50 L70 25 Z" fill="#aaa"></path>
</svg>
<div class="label">Variant 22: Tri-Fold<br/>(三段折叠 - 立体感)</div>
</div>
<!-- Variant 23: Sharp Paper (Crisp Edges) -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<path d="M20 20 L80 20 L40 80 L60 50 L20 80 L60 50 L80 20 L40 20" fill="white" fill-rule="evenodd"></path>
<!-- Correction for a sharper Z -->
<path d="M20 20 H80 L35 70 H80 V85 H20 L65 35 H20 V20 Z" fill="white"></path>
<path d="M65 35 L20 85 L35 70 L80 20" fill="black" opacity="0.2"></path>
</svg>
<div class="label">Variant 23: Shadow Crease<br/>(阴影折痕)</div>
</div>
<!-- Variant 24: Gradient Fold (Soft Light) -->
<div class="logo-item">
<svg fill="none" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="foldGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop class="logo-preview-v7-inline-style-1" offset="0%"></stop>
<stop class="logo-preview-v7-inline-style-2" offset="50%"></stop>
<stop class="logo-preview-v7-inline-style-3" offset="51%"></stop>
<stop class="logo-preview-v7-inline-style-1" offset="100%"></stop>
</lineargradient>
</defs>
<path d="M20 25 H80 L30 75 H80" stroke="url(#foldGrad)" stroke-linecap="butt" stroke-linejoin="round" stroke-width="12"></path>
</svg>
<div class="label">Variant 24: Soft Fold<br/>(柔和折光)</div>
</div>
</div>
</body>
</html>
