name: Security Tests

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/security-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-prod-env.js'
      - 'middleware.js'
      - 'server/**'
      - 'api/**'
      - 'tests/**'
      - 'admin-studio.html'
      - 'admin-studio.js'
      - 'admin-comments.js'
      - 'admin-points.js'
      - 'admin-analytics.js'
      - 'admin-entry.html'
      - 'supabase-auth-functions.js'
      - 'inject-auth.js'
      - 'index.html'
      - 'js/admin-access.js'
      - 'js/admin-entry.js'
      - 'verify-widget.js'
      - 'admin-config.js'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production env check script
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          ADMIN_CONFIG_ENCRYPTION_KEY: ci-admin-config-key
          PAYMENT_CUSTOM_RECHARGE_QUOTE_SECRET: ci-quote-secret
          ADMIN_STUDIO_ACCESS_SECRET: ci-admin-studio-secret
        run: npm run check:prod-env -- --allow-non-production

      - name: Run guarded rollout planner smoke check
        run: npm run rollout:payment -- --env-file server/.env.example --set incremental --project-ref ci-demo-ref --db-url postgresql://example.invalid/postgres

  security_test_shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security regression suite shard
        run: node --test --test-force-exit --test-shard=${{ matrix.shard }}/8 tests/*.test.js

  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - security_preflight
      - security_test_shards
    if: ${{ always() }}

    steps:
      - name: Verify security test result
        run: |
          if [ "${{ needs.security_preflight.result }}" != "success" ]; then
            echo "security_preflight did not pass: ${{ needs.security_preflight.result }}"
            exit 1
          fi
          if [ "${{ needs.security_test_shards.result }}" != "success" ]; then
            echo "security_test_shards did not pass: ${{ needs.security_test_shards.result }}"
            exit 1
          fi
          echo "Security test shards passed."
