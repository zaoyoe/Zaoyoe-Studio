name: Deploy KVM4 KC-PAY-GPT

on:
  push:
    branches:
      - main
    paths:
      - 'services/kc-pay-gpt/**'
      - 'scripts/deploy-kvm4-kc-pay.sh'
      - '.github/workflows/deploy-kvm4-kc-pay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kvm4-main
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy latest main KC-PAY-GPT to KVM4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    env:
      KVM4_HOST: ${{ vars.KVM4_HOST || '76.13.188.218' }}
      KVM4_PORT: ${{ vars.KVM4_PORT || '2222' }}
      KVM4_USER: ${{ vars.KVM4_USER || 'root' }}
      KVM4_KC_ROOT: ${{ vars.KVM4_KC_ROOT || '/opt/kc-pay-gpt' }}
      KVM4_KEY: /tmp/kvm4_kc_deploy_key_${{ github.run_id }}
      KEEP_RELEASES: ${{ vars.KVM4_KC_KEEP_RELEASES || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify checkout is latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git checkout -B main "$GITHUB_SHA"
          printf 'Verified latest main commit %s\n' "$GITHUB_SHA"

      - name: Prepare SSH access
        env:
          KVM4_SSH_PRIVATE_KEY: ${{ secrets.KVM4_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${KVM4_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error title=Missing GitHub secret::Set KVM4_SSH_PRIVATE_KEY in repository secrets before merging to main."
            exit 1
          fi

          mkdir -p "$HOME/.ssh" "$GITHUB_WORKSPACE/.ssh"
          chmod 700 "$HOME/.ssh" "$GITHUB_WORKSPACE/.ssh"
          printf '%s\n' "$KVM4_SSH_PRIVATE_KEY" > "$KVM4_KEY"
          chmod 600 "$KVM4_KEY"

          {
            printf 'Host %s\n' "$KVM4_HOST"
            printf '  Port %s\n' "$KVM4_PORT"
            printf '  User %s\n' "$KVM4_USER"
            printf '  IdentityFile %s\n' "$KVM4_KEY"
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy KC-PAY-GPT
        run: npm run deploy:kvm4:kc

      - name: Verify production routes
        run: node scripts/verify-deployment-routes.js kc
