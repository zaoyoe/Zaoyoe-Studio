name: Deploy KVM4 Verify Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kvm4-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy latest main to KVM4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    env:
      KVM4_HOST: ${{ vars.KVM4_HOST || '76.13.188.218' }}
      KVM4_PORT: ${{ vars.KVM4_PORT || '2222' }}
      KVM4_USER: ${{ vars.KVM4_USER || 'root' }}
      KVM4_ROOT: ${{ vars.KVM4_ROOT || '/opt/zaoyoe-verify-server' }}
      KVM4_KEY: /tmp/kvm4_deploy_key_${{ github.run_id }}
      KEEP_RELEASES: ${{ vars.KVM4_KEEP_RELEASES || '8' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare SSH access
        env:
          KVM4_SSH_PRIVATE_KEY: ${{ secrets.KVM4_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${KVM4_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error title=Missing GitHub secret::Set KVM4_SSH_PRIVATE_KEY in repository secrets before merging to main."
            exit 1
          fi

          mkdir -p "$HOME/.ssh" "$GITHUB_WORKSPACE/.ssh"
          chmod 700 "$HOME/.ssh" "$GITHUB_WORKSPACE/.ssh"
          printf '%s\n' "$KVM4_SSH_PRIVATE_KEY" > "$KVM4_KEY"
          chmod 600 "$KVM4_KEY"

          {
            printf 'Host %s\n' "$KVM4_HOST"
            printf '  Port %s\n' "$KVM4_PORT"
            printf '  User %s\n' "$KVM4_USER"
            printf '  IdentityFile %s\n' "$KVM4_KEY"
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Pin checkout to latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git status --short --branch

      - name: Deploy KVM4 verify server
        run: npm run deploy:kvm4:verify

      - name: Verify production routes
        shell: bash
        run: |
          set -Eeuo pipefail

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          curl -fsS --retry 5 --retry-delay 3 -A "$USER_AGENT" https://verify-api.fatherkey.com/healthz

          fetch_route() {
            local public_url="$1"
            local origin_url="$2"
            local output_file="$3"

            if ! curl -fsS --retry 3 --retry-delay 2 -A "$USER_AGENT" "$public_url" > "$output_file" 2>/dev/null; then
              echo "Public route $public_url returned error or challenge; falling back to direct origin $origin_url"
              curl -fsS --retry 5 --retry-delay 3 -A "$USER_AGENT" "$origin_url" > "$output_file"
            fi
          }

          fetch_route \
            'https://www.fatherkey.com/api/payments/config?site=cn' \
            'https://verify-api.fatherkey.com/api/payments/config?site=cn' \
            '/tmp/kvm4-payments-config.json'
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/kvm4-payments-config.json','utf8')); if (!payload.success) throw new Error('payments config failed'); console.log(JSON.stringify({payments_config:true, active_provider:payload.config?.active_provider || null}));"

          fetch_route \
            'https://www.fatherkey.com/api/shop/catalog?site=cn' \
            'https://verify-api.fatherkey.com/api/shop/catalog?site=cn' \
            '/tmp/kvm4-shop-catalog.json'
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/kvm4-shop-catalog.json','utf8')); if (!payload.success) throw new Error('shop catalog failed'); console.log(JSON.stringify({shop_catalog:true, categories:Array.isArray(payload.categories)?payload.categories.length:null, products:Array.isArray(payload.products)?payload.products.length:null}));"
