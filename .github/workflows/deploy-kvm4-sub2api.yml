name: Deploy KVM4 Sub2API

# `Sub2API` is the stable deployment-slot name. The public service runs NewAPI;
# phase one keeps legacy Sub2API only as a private compatibility bridge.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kvm4-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy latest main NewAPI in Sub2API slot to KVM4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    env:
      KVM4_HOST: ${{ vars.KVM4_HOST || '76.13.188.218' }}
      KVM4_PORT: ${{ vars.KVM4_PORT || '2222' }}
      KVM4_USER: ${{ vars.KVM4_USER || 'root' }}
      KVM4_SUB2API_ROOT: ${{ vars.KVM4_SUB2API_ROOT || '/opt/sub2api' }}
      KVM4_KEY: /tmp/kvm4_sub2api_deploy_key_${{ github.run_id }}
      KEEP_RELEASES: ${{ vars.KVM4_SUB2API_KEEP_RELEASES || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare SSH access
        env:
          KVM4_SSH_PRIVATE_KEY: ${{ secrets.KVM4_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${KVM4_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error title=Missing GitHub secret::Set KVM4_SSH_PRIVATE_KEY in repository secrets before merging to main."
            exit 1
          fi

          mkdir -p "$HOME/.ssh" "$GITHUB_WORKSPACE/.ssh"
          chmod 700 "$HOME/.ssh" "$GITHUB_WORKSPACE/.ssh"
          printf '%s\n' "$KVM4_SSH_PRIVATE_KEY" > "$KVM4_KEY"
          chmod 600 "$KVM4_KEY"

          {
            printf 'Host %s\n' "$KVM4_HOST"
            printf '  Port %s\n' "$KVM4_PORT"
            printf '  User %s\n' "$KVM4_USER"
            printf '  IdentityFile %s\n' "$KVM4_KEY"
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify checkout is latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short --branch
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Checked out main commit %s\n' "$GITHUB_SHA"

      - name: Deploy NewAPI in KVM4 Sub2API slot
        run: npm run deploy:kvm4:sub2api

      - name: Verify NewAPI public route in Sub2API slot
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsS --retry 5 --retry-delay 3 https://new.fatherkey.com/health > /tmp/kvm4-newapi-health.json
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/kvm4-newapi-health.json','utf8')); if (payload.status !== 'ok') throw new Error('NewAPI canonical route health failed'); console.log(JSON.stringify({newapi_canonical_health: payload.status}));"

          curl -fsS --retry 5 --retry-delay 3 https://sub2api.fatherkey.com/health > /tmp/kvm4-sub2api-compat-health.json
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/kvm4-sub2api-compat-health.json','utf8')); if (payload.status !== 'ok') throw new Error('NewAPI compatibility route health failed'); console.log(JSON.stringify({newapi_sub2api_compat_health: payload.status}));"
