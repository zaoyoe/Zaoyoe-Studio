name: Install KVM4 Guest Shop Worker

on:
  workflow_dispatch:
    inputs:
      start_timer:
        description: 'Start the 10s fulfillment timer after install (false = install and enable only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: install-kvm4-guest-shop-worker
  cancel-in-progress: false

jobs:
  install:
    name: Install guest-shop worker timer on KVM4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    env:
      KVM4_HOST: ${{ vars.KVM4_HOST || '76.13.188.218' }}
      KVM4_PORT: ${{ vars.KVM4_PORT || '2222' }}
      KVM4_USER: ${{ vars.KVM4_USER || 'root' }}
      KVM4_KEY: /tmp/kvm4_worker_key_${{ github.run_id }}
      START_TIMER: ${{ inputs.start_timer }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare SSH access
        env:
          KVM4_SSH_PRIVATE_KEY: ${{ secrets.KVM4_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${KVM4_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error title=Missing GitHub secret::Set KVM4_SSH_PRIVATE_KEY in repository secrets before dispatching this workflow."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KVM4_SSH_PRIVATE_KEY" > "$KVM4_KEY"
          chmod 600 "$KVM4_KEY"

          {
            printf 'Host %s\n' "$KVM4_HOST"
            printf '  Port %s\n' "$KVM4_PORT"
            printf '  User %s\n' "$KVM4_USER"
            printf '  IdentityFile %s\n' "$KVM4_KEY"
            printf '  StrictHostKeyChecking accept-new\n'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Pin checkout to latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git status --short --branch

      - name: Preflight release, health, port and secret gate
        shell: bash
        run: |
          set -Eeuo pipefail

          MAIN_SHA="$(git rev-parse HEAD)"
          echo "main sha: $MAIN_SHA"

          curl -fsS --retry 5 --retry-delay 3 https://verify-api.fatherkey.com/healthz > /dev/null
          echo "PASS  public https://verify-api.fatherkey.com/healthz"

          ssh "$KVM4_USER@$KVM4_HOST" 'bash -s' "$MAIN_SHA" <<'REMOTE'
          set -Eeuo pipefail

          EXPECT="${1:-}"
          ROOT=/opt/zaoyoe-verify-server

          die()  { echo "PREFLIGHT FAIL: $*" >&2; exit 1; }
          pass() { echo "PASS  $*"; }

          [[ -n "$EXPECT" ]] || die "expected main sha not supplied"
          [[ -d "$ROOT" ]] || die "$ROOT missing; deploy the verify server first"
          [[ -f "$ROOT/.env" ]] || die "$ROOT/.env missing"

          # AGENTS.md: the worker installer may only run once the matching main
          # commit is live on KVM4 Verify Server.
          CURRENT="$(tr -d '[:space:]' < "$ROOT/.current-release" 2>/dev/null || echo MISSING)"
          echo "verify .current-release: $CURRENT"
          [[ "$CURRENT" == "$EXPECT" ]] || die "verify server is on $CURRENT, main is $EXPECT"
          pass "verify .current-release == main"

          MODE="$(stat -c '%a' "$ROOT/.env")"
          echo ".env mode: $MODE"
          [[ "$MODE" == "600" ]] || die ".env mode must be 600, got $MODE"
          pass ".env mode 0600"

          # Length only.  Secret values are never printed.
          LEN="$(sed -n 's/^GUEST_SHOP_WORKER_SECRET=//p' "$ROOT/.env" | head -1 | tr -d '\r\n' | wc -c | tr -d '[:space:]')"
          LEN="${LEN:-0}"
          echo "host .env GUEST_SHOP_WORKER_SECRET length: $LEN"
          [[ "$LEN" -ge 32 ]] || die "GUEST_SHOP_WORKER_SECRET missing or shorter than 32"
          pass "host .env worker secret length ok"

          HEALTH="$(docker inspect -f '{{.State.Health.Status}}' zaoyoe-verify-server 2>/dev/null || echo missing)"
          echo "verify container health: $HEALTH"
          [[ "$HEALTH" == "healthy" ]] || die "verify container health is $HEALTH"
          pass "verify container healthy"

          if docker ps --format '{{.Names}}' | grep -qi 'sub2api-legacy'; then
            die "removed sub2api-legacy bridge container is running"
          fi
          pass "no sub2api-legacy bridge"

          # The systemd helper only ever talks to loopback:3001.
          curl -fsS -m 10 http://127.0.0.1:3001/healthz > /dev/null || die "loopback 127.0.0.1:3001/healthz failed"
          pass "loopback 127.0.0.1:3001/healthz"

          # Unauthenticated probe must hit the secret gate: 401.  A 503 would
          # mean the container has no usable worker secret, a 404 that the
          # route is missing from this release.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:3001/api/shop/guest/worker)"
          echo "unauthenticated worker probe: HTTP $CODE"
          [[ "$CODE" == "401" ]] || die "expected HTTP 401 from the worker secret gate, got $CODE"
          pass "worker route present and secret gate armed"

          # Informational: the 1-3s kick path needs both flags, the durable 10s
          # timer does not.  Values are never printed.
          docker exec zaoyoe-verify-server sh -c 'test "${GUEST_SHOP_IMMEDIATE_FULFILLMENT_ENABLED:-}" = "true" && echo "INFO  immediate_fulfillment=true (1-3s kick path armed)" || echo "INFO  immediate_fulfillment not true (10s timer fallback only)"'
          docker exec zaoyoe-verify-server sh -c 'test "${VERIFY_SERVER_WORKERS_ENABLED:-}" = "true" && echo "INFO  workers_enabled=true" || echo "INFO  workers_enabled not true"'
          docker exec zaoyoe-verify-server sh -c 'test -z "${VERCEL_ENV:-}" && echo "INFO  VERCEL_ENV empty (kick allowed)" || echo "INFO  VERCEL_ENV set (kick disabled)"'
          docker exec zaoyoe-verify-server sh -c 'n=${#GUEST_SHOP_WORKER_SECRET}; [ "$n" -ge 32 ] && echo "PASS  container worker secret length ok" || echo "INFO  container worker secret missing or <32"'

          echo "PREFLIGHT PASS"
          REMOTE

      - name: Install guest-shop worker units
        shell: bash
        run: |
          set -Eeuo pipefail
          # Canonical root only: the installer rejects a custom --root/KVM4_ROOT.
          if [[ "${START_TIMER:-false}" == "true" ]]; then
            npm run install:kvm4:guest-shop-worker -- --start
          else
            npm run install:kvm4:guest-shop-worker
          fi

      - name: Verify timer state and tick evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh "$KVM4_USER@$KVM4_HOST" 'bash -s' "${START_TIMER:-false}" <<'REMOTE'
          set -Eeuo pipefail

          STARTED="${1:-false}"
          TIMER=zaoyoe-guest-shop-worker.timer
          SERVICE=zaoyoe-guest-shop-worker.service

          echo "timer enabled: $(systemctl is-enabled "$TIMER" 2>&1)"
          echo "timer active:  $(systemctl is-active "$TIMER" 2>&1)"
          systemctl list-timers --all --no-pager | grep -E 'NEXT|guest-shop-worker' || true

          if [[ "$STARTED" != "true" ]]; then
            echo "timer installed and enabled but intentionally left stopped"
            exit 0
          fi

          if [[ "$(systemctl is-active "$TIMER" 2>&1)" != "active" ]]; then
            echo "TIMER FAIL: $TIMER is not active" >&2
            exit 1
          fi

          # Cover at least two 10s ticks (plus RandomizedDelaySec) so the
          # evidence is a real run, not the unit's pristine initial state.
          sleep 25

          RESULT="$(systemctl show "$SERVICE" -p Result --value)"
          CODE="$(systemctl show "$SERVICE" -p ExecMainStatus --value)"
          LAST="$(systemctl show "$SERVICE" -p ExecMainStartTimestamp --value)"
          echo "service result:      ${RESULT:-unknown}"
          echo "service exit code:   ${CODE:-unknown}"
          echo "last tick started:   ${LAST:-none}"
          journalctl -u "$SERVICE" -n 20 --no-pager 2>&1 | tail -20

          if [[ -z "$LAST" || "$LAST" == "n/a" || "$RESULT" != "success" || "$CODE" != "0" ]]; then
            echo "WORKER TICK FAIL (last=${LAST:-none} result=${RESULT:-unknown} exit=${CODE:-unknown}); stopping timer to fail closed" >&2
            systemctl stop "$TIMER"
            exit 1
          fi

          echo "WORKER TIMER PASS: enabled, active, ticking every 10s with exit 0"
          REMOTE
