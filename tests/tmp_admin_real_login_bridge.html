<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Real Login Bridge</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 24px;
            color: #111;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Admin Real Login Bridge</h1>
    <pre id="log">booting</pre>
    <script>
        (async () => {
            const logEl = document.getElementById('log');
            const write = (message) => {
                logEl.textContent += `\n${String(message || '')}`;
            };
            logEl.textContent = 'initializing';

            try {
                const url = new URL(window.location.href);
                const email = String(url.searchParams.get('email') || '').trim();
                const password = String(url.searchParams.get('password') || '').trim();
                let accessToken = String(url.searchParams.get('access_token') || '').trim();
                let refreshToken = String(url.searchParams.get('refresh_token') || '').trim();
                let expiresAt = Number(url.searchParams.get('expires_at') || '0') || 0;
                let authPayload = null;
                const next = String(url.searchParams.get('next') || '/admin-studio.html').trim() || '/admin-studio.html';
                const dryRun = url.searchParams.get('dryRun') === '1';

                const configText = await fetch('/api/runtime/supabase-config', {
                    headers: { Accept: 'application/javascript' }
                }).then((response) => response.text());
                const match = configText.match(/var config = (\{[\s\S]*?\});/);
                if (!match) {
                    throw new Error('runtime config parse failed');
                }
                const config = JSON.parse(match[1]);
                const projectRef = String(new URL(config.url).host || '').split('.')[0];
                if (!projectRef) {
                    throw new Error('project ref missing');
                }

                if (email && password) {
                    const authResponse = await fetch(`${config.url}/auth/v1/token?grant_type=password`, {
                        method: 'POST',
                        headers: {
                            apikey: config.publishableKey,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email,
                            password
                        })
                    });
                    authPayload = await authResponse.json().catch(() => ({}));
                    if (!authResponse.ok || !authPayload?.access_token || !authPayload?.refresh_token) {
                        throw new Error(authPayload?.msg || authPayload?.error_description || authPayload?.error || `password login failed (${authResponse.status})`);
                    }
                    accessToken = String(authPayload.access_token || '').trim();
                    refreshToken = String(authPayload.refresh_token || '').trim();
                    expiresAt = Number(authPayload.expires_at || '0') || 0;
                    write(`password login ok: ${email}`);
                }

                if (!accessToken || !refreshToken) {
                    throw new Error('missing access_token or refresh_token');
                }

                const payload = (() => {
                    try {
                        const base64 = accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
                        const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
                        return JSON.parse(atob(padded));
                    } catch (_) {
                        return {};
                    }
                })();

                const session = {
                    access_token: accessToken,
                    refresh_token: refreshToken,
                    expires_at: expiresAt || payload.exp || undefined,
                    expires_in: expiresAt ? Math.max(0, expiresAt - Math.floor(Date.now() / 1000)) : undefined,
                    token_type: 'bearer',
                    user: authPayload?.user || {
                        id: payload.sub || '',
                        email: payload.email || ''
                    }
                };
                const storageKey = `sb-${projectRef}-auth-token`;
                localStorage.setItem(storageKey, JSON.stringify(session));
                sessionStorage.setItem(storageKey, JSON.stringify(session));
                write(`session stored: ${storageKey}`);

                const response = await fetch('/api/admin/access/session', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        Authorization: `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                const payloadJson = await response.json().catch(() => ({}));
                if (!response.ok || payloadJson?.success === false) {
                    throw new Error(payloadJson?.message || `admin access session failed (${response.status})`);
                }

                write('admin access cookie granted');
                if (dryRun) {
                    write('dry run complete');
                    return;
                }
                write(`redirecting to ${next}`);
                window.location.replace(next);
            } catch (error) {
                logEl.textContent = `bridge failed\n${error && error.message ? error.message : String(error)}`;
            }
        })();
    </script>
</body>
</html>
