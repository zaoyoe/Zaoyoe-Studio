    <div id="promptModal" class="poetry-modal">
        <div class="modal-inner">

                <i class="fas fa-times"></i>

                </button>
                <button id="modalImgNavRight" class="modal-img-nav right" type="button">
                    <i class="fas fa-chevron-right"></i>

                <div id="modalImgCounter" class="modal-img-counter">1 / 1</div>

                <!-- Target Area for Prompt Docking (FLIP Animation Destination) -->

            </div>

            <div class="modal-content-col">
                <div class="modal-header">
                    <div id="modalTitle" class="modal-title-large">Title</div>
                    <div id="modalTags" class="modal-meta">
                        <!-- Tags injected here -->
                    </div>
                </div>

                <p id="modalDesc" class="modal-description">
                    Description goes here...
                </p>

                <!-- Prompt Area (FLIP Animation Source) -->
                <div id="promptArea" class="prompt-area">
                    <div class="prompt-content-wrapper">
                        <span class="prompt-label" data-i18n="gallery.prompt">Prompt</span>
                        <div id="modalPromptText" class="prompt-text blur-masked">
                            Loading prompt...
                        </div>
                    </div>

                    <!-- Action Bar: Unlock & Comment Trigger -->
                    <div class="prompt-action-bar">
                        <div class="action-left">
                            <button id="unlockPromptBtn" class="unlock-btn">
                                <i class="fas fa-gem"></i> 10
                            </button>
                        </div>
                        <div class="action-right">
                            <button id="commentTriggerBtn" class="comment-trigger-btn" type="button">
                                <i class="fas fa-comment-dots"></i>
                                <span id="commentCountBadge" class="comment-count">0</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Comment Section (Initially Hidden) -->
                <div id="commentSection" class="comment-section">
                    <!-- Comment Header: Title + Sorting -->
                    <div class="comment-header">
                        <div class="comment-header-title" id="commentSectionTitle">
                            <span data-i18n="gallery.viewAll">View all</span>
                        </div>
                        <div class="comment-sort-wrapper">
                            <button class="comment-sort-btn" id="commentSortBtn">
                                <span id="currentSortLabel" data-i18n="gallery.top">Top</span>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <div class="comment-sort-dropdown" id="commentSortDropdown">
                                <div class="sort-option active" data-sort="top" data-i18n="gallery.top">Top</div>
                                <div class="sort-option" data-sort="newest" data-i18n="gallery.newest">Newest</div>
                                <div class="sort-option" data-sort="oldest" data-i18n="gallery.oldest">Oldest</div>
                            </div>
                        </div>
                    </div>

                    <div class="comment-list" id="commentList">
                        <!-- Comments injected here -->
                    </div>

                    <div class="comment-input-area">
                        <div class="comment-input-proxy-ui" aria-hidden="true">
                            <svg class="comment-input-proxy-icon" viewBox="0 0 40 40" fill="none"
                                xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M10 8.5V16.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
                                <path d="M6 12.5H14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
                                <path
                                    d="M24.8 11.2L28.8 15.2L19.6 24.4L14.6 25.4L15.6 20.4L24.8 11.2Z"
                                    stroke="currentColor" stroke-width="2.35" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M22.6 13.4L26.6 17.4" stroke="currentColor" stroke-width="2.15"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M17.1 24.9L19.8 22.2" stroke="currentColor" stroke-width="2.15"
                                    stroke-linecap="round" />
                            </svg>
                        </div>
                        <textarea id="commentInput" placeholder=""
                            data-i18n-placeholder="gallery.addComment" rows="1"></textarea>

                        <!-- Hidden file input -->
                        <input type="file" id="commentImageUpload" accept="image/*" class="prompts-comment-image-upload-hidden">

                        <!-- Upload button -->
                        <button id="commentUploadBtn" class="comment-upload-btn" title="Attach image"
                            data-i18n-title="gallery.attachImage">
                            <i class="fas fa-image"></i>
                        </button>



                        <!-- 发送按钮 -->
                        <!-- 发送按钮 (小飞机图标) -->
                        <button id="sendCommentBtn" class="send-comment-btn" type="button" title="Send"
                            data-i18n-title="gallery.send">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
