<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Logo Concepts - Blueprint Variants</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 60px;
            text-align: center;
        }

        .logo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: 0.3s ease;
        }

        .logo-item:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .label {
            font-family: 'Inter', sans-serif;
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }

        svg {
            width: 80px;
            height: 80px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Blueprint Variants</h1>
    <div class="grid">
        <!-- Variant 29: Classic Blueprint (Original) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20 H80 L50 50 H80 V80 H20 L50 50 H20 V20 Z" stroke="white" stroke-width="2" />
                <path d="M20 50 H80" stroke="white" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
                <path d="M50 20 V80" stroke="white" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
            </svg>
            <div class="label">Variant 29: Original<br>(原版 - 辅助线)</div>
        </div>

        <!-- Variant 30: Tech Schematic (Dots & Nodes) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20 H80 L50 50 H80 V80 H20 L50 50 H20 V20 Z" stroke="white" stroke-width="2"
                    stroke-linejoin="round" />
                <!-- Corner dots -->
                <circle cx="20" cy="20" r="2" fill="white" />
                <circle cx="80" cy="20" r="2" fill="white" />
                <circle cx="80" cy="80" r="2" fill="white" />
                <circle cx="20" cy="80" r="2" fill="white" />
                <circle cx="50" cy="50" r="2" fill="white" />
                <!-- Thin grid lines -->
                <path d="M10 20 H90 M10 80 H90 M20 10 V90 M80 10 V90" stroke="white" stroke-width="0.5" opacity="0.3" />
            </svg>
            <div class="label">Variant 30: Schematic<br>(工程图纸)</div>
        </div>

        <!-- Variant 31: Architect Pencil (Looser Sketch) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Double stroke for sketch feel -->
                <path d="M22 22 H82 L52 52 H82 V82 H22 L52 52 H22 V22 Z" stroke="white" stroke-width="1.5" />
                <path d="M18 18 H78 L48 48 H78 V78 H18 L48 48 H18 V18 Z" stroke="white" stroke-width="1"
                    opacity="0.6" />
                <!-- Overshoot lines -->
                <line x1="15" y1="18" x2="85" y2="18" stroke="white" stroke-width="0.5" opacity="0.5" />
                <line x1="15" y1="82" x2="85" y2="82" stroke="white" stroke-width="0.5" opacity="0.5" />
            </svg>
            <div class="label">Variant 31: Sketch Draft<br>(建筑草图)</div>
        </div>

        <!-- Variant 32: Technical Measurement -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M25 25 H75 L25 75 H75" stroke="white" stroke-width="2" />
                <!-- Dimension lines -->
                <line x1="20" y1="25" x2="20" y2="75" stroke="white" stroke-width="0.5" opacity="0.7" />
                <line x1="18" y1="25" x2="22" y2="25" stroke="white" stroke-width="0.5" opacity="0.7" />
                <line x1="18" y1="75" x2="22" y2="75" stroke="white" stroke-width="0.5" opacity="0.7" />
                <text x="5" y="55" font-family="Arial" font-size="8" fill="white" opacity="0.7">100</text>
            </svg>
            <div class="label">Variant 32: Dimension<br>(标尺测量)</div>
        </div>
    </div>
</body>

</html>
