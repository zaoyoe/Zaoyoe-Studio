<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons Set 8: Refined Multi-Element Dynamics</title>
    
    <link rel="stylesheet" href="css/icons-preview-v8.css?v=20260324_REMAINING_HTML_STYLE_BLOCKS_1">
</head>

<body data-preview-stagger="160">

    <h1 data-preview-trigger-all="1">Refined Prompts Animation (Set 8)</h1>
    <p class="subtitle">Interact to see multi-element decomposition and recomposition</p>

    <div class="set-container">
        <div class="icons-grid">

            <!-- A: Nebula Core -->
            <div class="icon-wrapper">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" class="c-nebula">
                    <circle cx="50" cy="50" r="35" stroke="#333" class="ring ring-1"
                        style="transform: rotate(30deg) scaleY(0.4)" />
                    <circle cx="50" cy="50" r="35" stroke="#333" class="ring ring-2"
                        style="transform: rotate(-30deg) scaleY(0.4)" />

                    <path d="M50 35 L54 46 L65 50 L54 54 L50 65 L46 54 L35 50 L46 46 Z" fill="#F472B6"
                        class="center-star" />

                    <circle cx="75" cy="50" r="3" fill="#FFF" class="planet" style="opacity:0.6" />
                    <circle cx="25" cy="60" r="2" fill="#FFF" class="planet" style="opacity:0.4" />
                </svg>
                <div class="icon-label">Nebula (星云轨迹)</div>
            </div>

            <!-- B: Cyber Construct -->
            <div class="icon-wrapper">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" class="c-construct">
                    <!-- Core -->
                    <rect x="42" y="42" width="16" height="16" rx="2" fill="#333" class="core" />

                    <!-- Blocks -->
                    <path d="M40 38 L50 32 L60 38 L50 44 Z" fill="#444" class="block block-top" />
                    <path d="M38 42 L32 50 L38 58 L44 50 Z" fill="#444" class="block block-left" />
                    <path d="M62 42 L68 50 L62 58 L56 50 Z" fill="#444" class="block block-right" />
                    <path d="M50 62 L42 68 L50 74 L58 68 Z" fill="#444" class="block block-bottom" />
                </svg>
                <div class="icon-label">Construct (赛博重构)</div>
            </div>

            <!-- C: Magic Rune -->
            <div class="icon-wrapper">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" class="c-rune">
                    <!-- The Rune Path -->
                    <path d="M30 70 L50 20 L70 70 L25 35 H75 L30 70" stroke="#444" stroke-width="2"
                        stroke-linejoin="round" stroke-linecap="round" fill="none" />

                    <!-- Sparkles -->
                    <path d="M50 10 L52 15 L50 20 L48 15 Z" fill="#FFF" class="sparkle" />
                    <path d="M80 70 L83 75 L80 80 L77 75 Z" fill="#FFF" class="sparkle" style="animation-delay: 0.2s" />
                    <path d="M20 70 L23 75 L20 80 L17 75 Z" fill="#FFF" class="sparkle" style="animation-delay: 0.4s" />
                </svg>
                <div class="icon-label">Rune (秘术符文)</div>
            </div>

            <!-- D: Data Stream -->
            <div class="icon-wrapper">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" class="c-data">
                    <rect x="35" y="35" width="30" height="30" rx="4" class="icon-main" />
                    <path d="M45 50 H55 M50 45 V55" stroke="#555" stroke-width="2" />

                    <!-- Streams -->
                    <path d="M50 10 V30" stroke="#333" stroke-width="2" class="stream-line" />
                    <path d="M50 70 V90" stroke="#333" stroke-width="2" class="stream-line"
                        style="animation-delay: 0.1s; animation-direction: reverse;" />
                    <path d="M10 50 H30" stroke="#333" stroke-width="2" class="stream-line"
                        style="animation-delay: 0.2s" />
                    <path d="M70 50 H90" stroke="#333" stroke-width="2" class="stream-line"
                        style="animation-delay: 0.3s; animation-direction: reverse;" />
                </svg>
                <div class="icon-label">Stream (数据流)</div>
            </div>

        </div>
    </div>

    <script src="./js/preview-icons-page.js"></script>
</body>

</html>
