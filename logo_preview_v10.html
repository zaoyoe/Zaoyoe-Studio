<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Logo Concepts - Origami Set 2</title>
    <link rel="stylesheet" href="css/logo-preview-grid-page.css?v=20260324_LOGO_PREVIEW_GRID_PAGE_STYLES_1">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Origami Art Variants (Set 2)</h1>
    <div class="grid">
        <!-- Variant 33: Paper Plane (Dynamic) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20 L80 20 L50 60 L20 20" fill="white" fill-opacity="0.9" />
                <path d="M50 60 L80 80 L20 80 L50 60" fill="white" fill-opacity="0.7" />
                <path d="M20 20 L50 60 L20 80" fill="white" fill-opacity="0.4" />
                <path d="M80 20 L80 80 L50 60" fill="white" fill-opacity="0.4" />
            </svg>
            <div class="label">Variant 33: Paper Plane<br>(纸飞机 - 动态)</div>
        </div>

        <!-- Variant 34: Low Poly (Faceted) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 20 L60 20 L40 50 L20 20" fill="#eee" />
                <path d="M60 20 L80 20 L?40 50 L60 20" fill="#ccc" /> <!-- Adjusted logic -->
                <path d="M20 20 H70 L40 50 Z" fill="#fff" />
                <path d="M70 20 L80 30 L40 50 Z" fill="#bbb" />
                <path d="M40 50 L80 80 H30 L40 50" fill="#fff" />
                <path d="M30 80 L20 70 L40 50 Z" fill="#999" />
            </svg>
            <div class="label">Variant 34: Low Poly<br>(低多边形 - 晶体)</div>
        </div>

        <!-- Variant 35: Ribbon Twist (Mobius) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M25 30 C 50 30, 40 70, 75 70" stroke="white" stroke-width="12" stroke-linecap="round" />
                <!-- Highlight/Shadow to imply twist -->
                <path d="M25 30 C 50 30, 40 70, 75 70" stroke="black" stroke-width="2" stroke-dasharray="2 100"
                    stroke-linecap="round" opacity="0.3" />
                <!-- Separate top and bottom bars for visual Z -->
                <path d="M20 30 H50" stroke="white" stroke-width="12" stroke-linecap="round" />
                <path d="M50 70 H80" stroke="white" stroke-width="12" stroke-linecap="round" />
            </svg>
            <div class="label">Variant 35: Twist Fold<br>(扭转折叠)</div>
        </div>

        <!-- Variant 36: Paper Cut (Layered) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Background Layer -->
                <rect x="15" y="15" width="70" height="70" fill="#333" rx="10" />
                <!-- Middle Layer -->
                <rect x="20" y="20" width="60" height="60" fill="#666" rx="8" />
                <!-- Top Layer (Z Cutout) -->
                <path d="M25 25 H75 V40 H45 L70 60 H75 V75 H25 V60 H55 L30 40 H25 V25 Z" fill="white" />
            </svg>
            <div class="label">Variant 36: Paper Cut<br>(剪纸镂空)</div>
        </div>
    </div>
</body>

</html>
