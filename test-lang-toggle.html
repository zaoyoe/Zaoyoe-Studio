<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Toggle Test</title>
    <style>
        body {
            font-family: system-ui;
            padding: 40px;
            background: #1a1a1a;
            color: white;
        }

        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .lang-toggle-simple {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        .lang-toggle-simple:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .lang-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .lang-text.active {
            color: rgba(255, 255, 255, 0.95);
        }

        .lang-separator {
            color: rgba(255, 255, 255, 0.3);
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-left: 3px solid #0f0;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>🧪 Language Toggle Test</h1>

    <div class="test-section">
        <h2>Test 1: i18n Loading</h2>
        <div id="test1"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Toggle Button</h2>
        <button id="langToggleTest" type="button" class="lang-toggle-simple">
            <span id="langZhTest" class="lang-text active">中</span>
            <span class="lang-separator">|</span>
            <span id="langEnTest" class="lang-text">EN</span>
        </button>
        <div id="test2" class="status"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Translation</h2>
        <p data-i18n="nav.prompts">提示词</p>
        <p data-i18n="nav.shop">商城</p>
        <div id="test3"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Persistence</h2>
        <div id="test4"></div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="./js/test-lang-toggle-page.js"></script>
</body>

</html>
