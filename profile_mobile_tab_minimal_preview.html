<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>个人资料 - 超精简版预览</title>
  <style>
    :root {
      --page-bg: #e8eef3;
      --shell-bg: #f7f8fa;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #1f2a37;
      --text-sub: #6b7785;
      --text-soft: #95a0ab;
      --line: #e8edf1;
      --brand: #c46b3b;
      --brand-deep: #9e5027;
      --brand-soft: #f8ece4;
      --shadow: 0 14px 32px rgba(24, 37, 52, 0.08);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 18% -8%, rgba(233, 214, 198, 0.9), transparent 34%),
        radial-gradient(circle at 88% 0%, rgba(211, 226, 235, 0.95), transparent 38%),
        linear-gradient(180deg, #edf2f6 0%, var(--page-bg) 100%);
      font-family: "PingFang SC", "SF Pro Display", "Helvetica Neue", -apple-system, sans-serif;
      color: var(--text-main);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .phone {
      width: min(393px, calc(100vw - 24px));
      height: min(852px, calc(100dvh - 24px));
      padding: 10px;
      border-radius: 34px;
      background: #111924;
      box-shadow: 0 28px 64px rgba(17, 25, 36, 0.22);
    }

    .screen {
      height: 100%;
      border-radius: 26px;
      background: var(--shell-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #98a4b0;
      font-size: 11px;
      letter-spacing: 0.4px;
      background: linear-gradient(180deg, #f5f7fa 0%, #f7f8fa 100%);
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 8px;
      padding: 10px 16px 12px;
      background: rgba(247, 248, 250, 0.92);
      border-bottom: 1px solid rgba(232, 237, 241, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .tab {
      height: 36px;
      border-radius: 999px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-soft);
      background: #eff3f6;
    }

    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      box-shadow: 0 8px 18px rgba(196, 107, 59, 0.26);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px calc(120px + env(safe-area-inset-bottom));
    }

    .hero {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(252, 249, 246, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 20px 18px 18px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -38px;
      right: -24px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 107, 59, 0.16) 0%, rgba(196, 107, 59, 0) 68%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e0a46f 0%, #c96f4a 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 600;
      box-shadow: 0 10px 24px rgba(201, 111, 74, 0.28);
      flex-shrink: 0;
    }

    .hero-main {
      min-width: 0;
      flex: 1;
    }

    .eyebrow {
      font-size: 12px;
      color: var(--text-soft);
      letter-spacing: 0.2px;
      margin-bottom: 4px;
    }

    .name {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .sub {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-sub);
    }

    .private-tip {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--brand-soft);
      color: #7e4d30;
      font-size: 13px;
      line-height: 1.45;
    }

    .private-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand);
      flex-shrink: 0;
    }

    .card {
      margin-top: 12px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 10px 16px;
    }

    .info-row {
      min-height: 52px;
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-key {
      font-size: 14px;
      color: var(--text-soft);
    }

    .info-val {
      text-align: right;
      font-size: 15px;
      color: var(--text-main);
      word-break: break-all;
    }

    .helper {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.5;
      padding: 0 10px;
    }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      z-index: 6;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(
        180deg,
        rgba(247, 248, 250, 0.2) 0%,
        rgba(247, 248, 250, 0.95) 34%,
        rgba(247, 248, 250, 1) 100%
      );
      border-top: 1px solid rgba(232, 237, 241, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .primary-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      box-shadow: 0 12px 22px rgba(196, 107, 59, 0.24);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status">iPhone 17 Safari · 9:41</div>

      <div class="tabs">
        <div class="tab active">资料</div>
        <div class="tab">安全</div>
      </div>

      <main class="content">
        <section class="hero">
          <div class="hero-top">
            <div class="avatar">林</div>
            <div class="hero-main">
              <div class="eyebrow">账户概览</div>
              <div class="name">林晚青</div>
              <div class="sub">ID 103294</div>
            </div>
          </div>

          <div class="private-tip">
            <span class="private-dot"></span>
            <span>这部分资料仅用于账号识别与管理，不会作为公开个人主页展示。</span>
          </div>
        </section>

        <section class="card">
          <div class="info-row">
            <div class="info-key">昵称</div>
            <div class="info-val">林晚青</div>
          </div>
          <div class="info-row">
            <div class="info-key">邮箱</div>
            <div class="info-val">lin@example.com</div>
          </div>
          <div class="info-row">
            <div class="info-key">注册时间</div>
            <div class="info-val">2025-10-22</div>
          </div>
        </section>

        <div class="helper">只保留必要信息，减少打扰，让页面更像账户设置而不是公开档案。</div>
      </main>

      <div class="bottom-bar">
        <button class="primary-btn">编辑资料</button>
      </div>
    </div>
  </div>
</body>
</html>
