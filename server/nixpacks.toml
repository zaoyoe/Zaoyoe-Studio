# Nixpacks configuration for Puppeteer support
providers = ["node"]

[phases.setup]
# Required libraries for Chrome/Chromium to run
aptPkgs = ["libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libgbm1", "libasound2t64", "libpangocairo-1.0-0", "libxss1", "libgtk-3-0", "libxshmfence1", "libglu1-mesa", "fonts-liberation", "libdrm2", "libxcomposite1", "libxdamage1", "libxrandr2", "libxkbcommon0", "ca-certificates", "wget", "gnupg"]

[phases.install]
# Install Google Chrome first, then run npm ci with skip chromium download
cmds = [
    "wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/googlechrome-linux-keyring.gpg",
    "echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/googlechrome-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list",
    "sudo apt-get update",
    "sudo apt-get install -y google-chrome-stable",
    "npm ci"
]

[variables]
# Skip Puppeteer's Chromium download - use Google Chrome instead
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
# Tell Puppeteer where to find Google Chrome
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/google-chrome-stable"
