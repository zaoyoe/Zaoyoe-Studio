    <!-- Prevent flash of wrong theme -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        /* Force 4 columns - Override any conflicts */
        .guestbook-main {
            max-width: 100% !important;
            width: 100% !important;
            width: 100% !important;
            padding: 0 16px !important;
            /* Reduced padding */
            box-sizing: border-box !important;
            /* Prevent overflow */
            overflow-x: hidden !important;
            /* Force hide overflow */
        }

        .message-container {
            width: 100% !important;
        }

        /* Apply animation to wrapper (JS generates wrapper with inline delay) */
        .message-anim-wrapper {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            /* Delay is set inline by JS via transition-delay */
        }

        .message-anim-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 确保卡片背景不会闪烁 */
        .message-item {
            background: rgba(255, 255, 255, 0.75);
            break-inside: avoid !important;
            -webkit-column-break-inside: avoid !important;
            page-break-inside: avoid !important;
            margin-bottom: 20px !important;
            width: 100% !important;
        }



        /* Ensure responsive doesn't override */
        @media (min-width: 1441px) {
            /* Masonry layout handled by JS */
        }

        @media (max-width: 1440px) and (min-width: 1025px) {
            /* Masonry layout handled by JS */
        }

        /* Tablet screens */
        @media (max-width: 1024px) and (min-width: 769px) {
            /* Masonry layout handled by JS */
        }

        /* Mobile/Tablet adjustments */
        @media (max-width: 1024px) {
            .guestbook-main {
                padding: 0 15px !important;
            }

            /* Masonry layout handled by JS */
        }



        /* Exit animation */
        @keyframes fadeOutDown {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .page-exit {
            animation: fadeOutDown 0.3s ease-in forwards;
        }

        /* Prevent iOS zoom on input focus */
        @media (max-width: 768px) {

            /* Global text size adjustment prevention */
            * {
                -webkit-text-size-adjust: 100%;
            }

            .guestbook-main {
                padding-top: 100px !important;
            }

            /* Force all inputs to 16px minimum */
            textarea,
            input,
            select,
            input[type="text"],
            input[type="email"],
            input[type="password"] {
                font-size: 16px !important;
                /* Prevents iOS zoom */
            }
        }

        /* ⚡ CRITICAL FIX: Force dark text on white cards - 柔和配色 */
        .message-item .author-name {
            color: rgba(0, 0, 0, 0.7) !important;
        }

        .message-item .message-time {
            color: rgba(0, 0, 0, 0.4) !important;
        }

        .message-item .message-content {
            color: rgba(0, 0, 0, 0.85) !important;
        }

        .message-item .action-btn,
        .message-item .like-btn,
        .message-item .comment-btn {
            color: rgba(0, 0, 0, 0.5) !important;
        }

        .message-item .action-btn:hover,
        .message-item .like-btn:hover,
        .message-item .comment-btn:hover {
            color: rgba(0, 0, 0, 0.75) !important;
        }

        /* ⚡ CRITICAL FIX: Ensure active like button is RED */
        .message-item .like-btn.active,
        .message-item .like-btn.active:hover {
            color: #ef4444 !important;
        }

        .comment-item .comment-author {
            color: rgba(0, 0, 0, 0.7) !important;
        }

        .comment-item .comment-time {
            color: rgba(0, 0, 0, 0.4) !important;
        }

        .comment-item .comment-content {
            color: rgba(0, 0, 0, 0.85) !important;
        }

        .comment-count-group {
            color: rgba(0, 0, 0, 0.6) !important;
        }

        .comment-toggle-btn {
            color: rgba(0, 0, 0, 0.6) !important;
        }

        .add-comment-trigger-btn {
            color: rgba(0, 0, 0, 0.6) !important;
        }

        /* Replicated Back Link from Verify Page */
        .back-link {
            position: fixed;
            top: 32px;
            left: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: rgba(255, 255, 255, 0.85);
            /* Default Light text? Guestbook is Light Mode? */
            /* Guestbook body background is blobs (light/color). */
            /* Verify page is Dark/Starry. Back button there is Dark Glass with White Text. */
            /* If Guestbook is Light, maybe Dark Glass is fine (high contrast)? */
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.6);
            /* Dark Glass */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 100;
        }

        .back-link:hover {
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Frosted Glass Bell Icon (Match inject-auth.js style) */
        #notifBtn {
            width: 36px !important;
            height: 36px !important;
            background: rgba(15, 23, 42, 0.6) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 50% !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
            color: rgba(255, 255, 255, 0.9) !important;
            transition: all 0.2s ease !important;
        }

        #notifBtn:hover {
            background: rgba(15, 23, 42, 0.8) !important;
            transform: scale(1.05) !important;
        }
    </style>
    <script>
        // Handle back button with exit animation
        document.addEventListener('DOMContentLoaded', function () {
            const backBtn = document.querySelector('.floating-back-btn');

            if (backBtn) {
                backBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetUrl = this.getAttribute('href');

                    // Add exit animation to main container
                    const mainContainer = document.querySelector('.guestbook-main');

                    if (mainContainer) {
                        mainContainer.classList.add('page-exit');
                    }

                    // Navigate after animation
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }

                        , 300);
                });
            }
        });
    </script>
</head>

<body class="guestbook-page">
    <!-- Dropdown Blur Overlay -->
    <div class="dropdown-overlay" id="dropdownOverlay"></div>

    <!-- Background Blobs -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <!-- Floating Back Button -->
    <!-- Back to Home Button (Replicated) -->
    <a href="index.html" class="back-link" title="返回首页">
        <i class="fas fa-house"></i>
    </a>

    <!-- ✨ 智能通知胶囊 (v5.2 - Fixed Refresh) -->
    <div id="smart-capsule" class="capsule-wrapper" role="status" aria-live="polite"
        onclick="CapsuleManager.applyUpdates()">
        <div class="capsule-content">
            <span class="capsule-icon">🔔</span>
            <span id="capsule-text" class="capsule-text" data-i18n="guestbook.newUpdates">有新动态</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="guestbook-main">
        <!-- Hidden initially to prevent FOUC/Garbage text -->
        <div id="messageContainer" class="message-container" style="opacity: 0; transition: opacity 0.3s ease;">
            <!-- Messages will be inserted here by JavaScript -->
        </div>
        <div id="emptyState" class="empty-state-large" style="display: none;"><i class="fas fa-comments"></i>
            <p data-i18n="guestbook.noMessages">还没有留言哦</p>
            <p class="empty-hint" data-i18n="guestbook.leaveFirstMessage">快去首页留下你的第一条留言吧 !</p>
        </div>
    </div>
    <!-- Comment Modal -->
    <div class="modal-overlay" id="commentModal" onclick="closeCommentModal(event)">
        <div class="modal-content comment-modal-content">
            <!-- Mac-style close button -->
            <div class="mac-controls">
                <div class="mac-dot red" onclick="closeCommentModal(event)">
                    <i class="fas fa-times"></i>
                </div>
            </div>

            <h2 class="modal-title" data-i18n="guestbook.postComment">发表评论</h2>

            <form id="commentForm" class="add-comment-form">
                <input type="hidden" id="commentMessageId">
                <input type="hidden" id="commentParentId">
                <textarea id="commentContent" placeholder="写下您的评论..." rows="3" required></textarea>
                <button type="submit" class="submit-btn">
                    <span data-i18n="guestbook.submit">发送</span>
                </button>
            </form>
        </div>
    </div>
