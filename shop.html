        <!-- Purchase Confirmation Modal (Quantity) -->
        <div class="modal-overlay" id="shopPurchaseModal">
            <div class="modal-content premium-modal">
                <!-- Close Button -->
                <div class="mac-controls">
                    <div id="shopPurchaseModalCloseBtn" class="mac-dot red" role="button" tabindex="0" aria-label="Close purchase modal">
                        <i class="fas fa-times"></i>
                    </div>
                </div>

                <div class="shop-purchase-stage shop-purchase-stage-header shop-inline-style-attr-5">
                    <h3 class="card-title shop-inline-style-attr-6"
                        data-i18n="shop.confirmRedeem">
                        确认兑换</h3>
                    <p id="modalProductName" class="shop-inline-style-attr-7">Product Name</p>
                </div>

                <!-- Quantity Selector -->
                <div class="shop-quantity-wrapper shop-purchase-stage shop-purchase-stage-quantity">
                    <div class="shop-quantity-control">
                        <button class="shop-qty-btn" type="button" data-shop-qty-delta="-1">−</button>
                        <input type="number" id="purchaseQuantity" value="1" min="1" max="99" class="shop-qty-input">
                        <button class="shop-qty-btn" type="button" data-shop-qty-delta="1">+</button>
                    </div>
                </div>

                <!-- Add Discount Code Input Here -->
                <div class="shop-purchase-stage shop-purchase-stage-discount shop-inline-style-attr-8">
                    <div
                        data-i18n="shop.discountCode" class="shop-inline-style-attr-9">优惠码 (选填)</div>
                    <div class="shop-inline-style-attr-10">
                        <input type="text" id="purchaseDiscountCode" placeholder="输入优惠码"
                            data-i18n-placeholder="shop.enterDiscountCode"
                            class="shop-inline-style-attr-11">
                        <button id="applyDiscountBtn" type="button" data-i18n="shop.verify"
                            class="shop-inline-style-attr-12">验证</button>
                    </div>
                    <div id="discountMessage" class="shop-inline-style-attr-13"></div>
                </div>

                <!-- Price Summary -->
                <div class="shop-purchase-stage shop-purchase-stage-summary shop-inline-style-attr-14"
                   >
                    <div class="shop-inline-style-attr-15">
                        <div
                            data-i18n="shop.unitPrice" class="shop-inline-style-attr-16">单价</div>
                        <div class="shop-inline-style-attr-17"><span id="modalUnitPrice">0</span> <span
                                data-i18n="shop.points">积分</span></div>
                    </div>
                    <div class="shop-inline-style-attr-18">
                        <div
                            data-i18n="shop.total" class="shop-inline-style-attr-16">总计</div>
                        <div class="shop-inline-style-attr-19">
                            <span id="modalTotalPrice">0</span> <span
                                data-i18n="shop.points" class="shop-inline-style-attr-20">积分</span>
                        </div>
                    </div>
                </div>

                <div id="purchaseNotesBox" class="shop-purchase-stage shop-purchase-stage-notes shop-inline-style-attr-21">
                    <div
                        class="shop-inline-style-attr-22">
                        <i class="fas fa-triangle-exclamation shop-inline-style-attr-23"></i>
                        <span>注意事项</span>
                    </div>
                    <div id="purchaseNotesCard" class="glass-box shop-success-usage-card">
                        <div id="purchaseNotesContent"
                            class="shop-inline-style-attr-24">
                        </div>
                    </div>
                </div>

                <!-- Actions -->

        <!-- Success Modal (Re-used structure) -->
        <div class="modal-overlay shop-inline-style-attr-26" id="shopSuccessModal">
            <div class="modal-content premium-modal shop-success-modal">
                <div class="shop-success-stage shop-success-stage-icon shop-inline-style-attr-27"
                   >
                    <i class="fas fa-check shop-inline-style-attr-28"></i>
                </div>
                <h2 class="card-title shop-success-stage shop-success-stage-title" data-i18n="shop.redeemSuccess">兑换成功!</h2>

                <div class="shop-success-scroll">
                    <!-- Product content header with tooltip dot (outside overflow container) -->
                    <div class="shop-success-scroll-stage shop-success-scroll-stage-meta shop-inline-style-attr-29"
                       >
                        <span data-i18n="shop.productContent">商品内容:</span>
                        <span id="productNameDot" class="product-name-dot" data-tooltip="">
                            <i class="fas fa-circle shop-inline-style-attr-30"></i>
                        </span>
                    </div>

                    <div class="glass-box shop-success-content-shell shop-success-scroll-stage shop-success-scroll-stage-content shop-inline-style-attr-31"
                       >
                        <div id="purchasedContent"
                            class="shop-inline-style-attr-32">
                            <!-- Content Here -->
                        </div>
                    </div>

                    <!-- Usage Instructions Box (Conditionally shown) -->
                    <div id="usageInstructionsBox" class="shop-success-scroll-stage shop-success-scroll-stage-usage shop-inline-style-attr-33">
                        <div
                            class="shop-inline-style-attr-34">
                            <i class="fas fa-info-circle shop-inline-style-attr-35"></i>
                            <span data-i18n="shop.usageInstructions">使用说明</span>
                        </div>
                        <div class="glass-box shop-success-usage-card">
                            <div id="usageInstructionsContent"
                                class="shop-inline-style-attr-36">
                            </div>
                        </div>
                    </div>

                    <!-- Warning Box (Initially Hidden) -->
                    <div id="purchasedWarning" class="glass-box shop-success-scroll-stage shop-success-scroll-stage-warning shop-inline-style-attr-37"
                       >
                        <div class="shop-inline-style-attr-38">
                            <i class="fas fa-exclamation-triangle shop-inline-style-attr-39"></i>
                            <div class="shop-inline-style-attr-40">
                                <div data-i18n="shop.specialTip" class="shop-inline-style-attr-41">特别提示</div>
                                <div id="purchasedWarningText"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="shop-success-actions shop-success-stage shop-success-stage-actions">
                    <button id="copyContentBtn" type="button" class="shop-btn shop-btn-primary shop-inline-style-attr-42"
                       >
                        <i class="fas fa-copy"></i> <span data-i18n="common.copy">复制</span>
                    </button>
                    <button id="exportContentBtn" type="button"
                        class="shop-btn shop-btn-secondary shop-inline-style-attr-42">
                        <i class="fas fa-download"></i> <span data-i18n="common.export">导出</span>
                    </button>
                </div>
            </div>
