<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词双语迁移工具</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #16161e;
            --border: #2a2a3e;
            --text: #e4e4e7;
            --text-muted: #71717a;
            --accent: #6366f1;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .config-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .config-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .config-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .config-row label {
            min-width: 120px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="password"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.875rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--border);
        }

        .progress-container {
            margin-top: 1rem;
        }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .log-container {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 0.25rem;
        }

        .log-entry.success {
            color: var(--success);
        }

        .log-entry.error {
            color: var(--error);
        }

        .log-entry.warning {
            color: var(--warning);
        }

        .log-entry.info {
            color: var(--text-muted);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hidden {
            display: none !important;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>🌐 提示词双语迁移工具</h1>
        <p class="subtitle">为现有提示词批量生成英文标题和描述</p>

        <!-- Config Card -->
        <div class="config-card">
            <div class="config-title">⚙️ 配置</div>
            <div class="config-row">
                <label>Supabase URL</label>
                <input type="text" id="supabaseUrl" placeholder="https://xxx.supabase.co">
            </div>
            <div class="config-row">
                <label>Supabase Key</label>
                <input type="password" id="supabaseKey" placeholder="your-anon-key">
            </div>
            <div class="config-row">
                <label>Gemini API Key</label>
                <input type="password" id="geminiKey" placeholder="your-gemini-api-key">
            </div>
            <div class="config-row">
                <button class="btn" id="loadBtn" onclick="loadPrompts()">加载提示词</button>
            </div>
        </div>

        <!-- Stats Card -->
        <div class="config-card hidden" id="statsCard">
            <div class="config-title">📊 统计</div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="needsTranslation">0</div>
                    <div class="stat-label">需要翻译</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">已完成</div>
                </div>
            </div>
            <button class="btn" id="startBtn" onclick="startMigration()">🚀 开始迁移</button>
            <button class="btn btn-secondary" onclick="stopMigration()" style="margin-left: 0.5rem;">停止</button>
        </div>

        <!-- Progress Card -->
        <div class="config-card hidden" id="progressCard">
            <div class="config-title">📈 进度</div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备中...</div>
            </div>
        </div>

        <!-- Log Card -->
        <div class="config-card hidden" id="logCard">
            <div class="config-title">📝 日志</div>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <script>
        // Supabase client
        let supabase = null;
        let prompts = [];
        let isRunning = false;
        let geminiKey = '';

        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';

        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        async function loadPrompts() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            geminiKey = document.getElementById('geminiKey').value.trim();

            if (!url || !key || !geminiKey) {
                alert('请填写所有配置项');
                return;
            }

            // Initialize Supabase
            const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            supabase = createClient(url, key);

            log('正在加载提示词...', 'info');

            try {
                const { data, error } = await supabase
                    .from('prompts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                prompts = data;

                // Count prompts needing translation
                const needsWork = prompts.filter(p => !p.title_en || !p.description_en);

                document.getElementById('totalCount').textContent = prompts.length;
                document.getElementById('needsTranslation').textContent = needsWork.length;
                document.getElementById('completedCount').textContent = prompts.length - needsWork.length;

                document.getElementById('statsCard').classList.remove('hidden');
                document.getElementById('logCard').classList.remove('hidden');

                log(`加载完成: ${prompts.length} 个提示词, ${needsWork.length} 个需要翻译`, 'success');

            } catch (err) {
                log(`加载失败: ${err.message}`, 'error');
            }
        }

        async function translateWithGemini(title, description) {
            const prompt = `Translate the following Chinese text to English. Return ONLY a JSON object, no markdown.

Input:
- Title: "${title}"
- Description: "${description || ''}"

Output format:
{
    "title_en": "English title (2-5 words, creative)",
    "description_en": "English description (1-2 sentences)"
}

IMPORTANT: Return ONLY valid JSON.`;

            const response = await fetch(`${GEMINI_API_URL}?key=${geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }]
                    }]
                })
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

            // Parse JSON from response
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
                return JSON.parse(jsonMatch[0]);
            }
            throw new Error('Invalid response format');
        }

        async function startMigration() {
            if (isRunning) return;

            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('progressCard').classList.remove('hidden');

            const needsWork = prompts.filter(p => !p.title_en || !p.description_en);
            let completed = 0;

            log(`开始迁移 ${needsWork.length} 个提示词...`, 'info');

            for (const prompt of needsWork) {
                if (!isRunning) {
                    log('用户停止迁移', 'warning');
                    break;
                }

                try {
                    log(`翻译: ${prompt.title}`, 'info');

                    // Get translation
                    const translation = await translateWithGemini(prompt.title, prompt.description);

                    // Update database
                    const { error } = await supabase
                        .from('prompts')
                        .update({
                            title_en: translation.title_en,
                            title_zh: prompt.title, // Keep original as Chinese
                            description_en: translation.description_en,
                            description_zh: prompt.description // Keep original as Chinese
                        })
                        .eq('id', prompt.id);

                    if (error) throw error;

                    completed++;
                    const percent = Math.round((completed / needsWork.length) * 100);
                    document.getElementById('progressFill').style.width = `${percent}%`;
                    document.getElementById('progressText').textContent = `${completed}/${needsWork.length} (${percent}%)`;
                    document.getElementById('completedCount').textContent = prompts.length - needsWork.length + completed;

                    log(`✓ ${prompt.title} → ${translation.title_en}`, 'success');

                    // Rate limit: wait 500ms between requests
                    await new Promise(r => setTimeout(r, 500));

                } catch (err) {
                    log(`✗ ${prompt.title}: ${err.message}`, 'error');
                }
            }

            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            log(`迁移完成! 成功 ${completed}/${needsWork.length}`, 'success');
        }

        function stopMigration() {
            isRunning = false;
            log('正在停止...', 'warning');
        }

        // Try to load saved config from localStorage
        document.getElementById('supabaseUrl').value = localStorage.getItem('supabaseUrl') || '';
        document.getElementById('supabaseKey').value = localStorage.getItem('supabaseKey') || '';
        document.getElementById('geminiKey').value = localStorage.getItem('geminiKey') || '';

        // Save config on change
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', () => {
                localStorage.setItem(input.id, input.value);
            });
        });
    </script>
</body>

</html>
