<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示词双语迁移工具</title>
    <link rel="stylesheet" href="../css/migrate-prompts-bilingual-page.css?v=20260324_MIGRATE_PROMPTS_BILINGUAL_STYLE_ATTRS_1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>🌐 提示词双语迁移工具</h1>
        <p class="subtitle">为现有提示词批量生成英文标题和描述</p>

        <!-- Config Card -->
        <div class="config-card">
            <div class="config-title">⚙️ 配置</div>
            <div class="config-row">
                <label>Supabase URL</label>
                <input type="text" id="supabaseUrl" placeholder="https://xxx.supabase.co">
            </div>
            <div class="config-row">
                <label>Supabase Key</label>
                <input type="password" id="supabaseKey" placeholder="your-anon-key">
            </div>
            <div class="config-row">
                <label>Gemini API Key</label>
                <input type="password" id="geminiKey" placeholder="your-gemini-api-key">
            </div>
            <div class="config-row">
                <button class="btn" id="loadBtn" type="button">加载提示词</button>
            </div>
        </div>

        <!-- Stats Card -->
        <div class="config-card hidden" id="statsCard">
            <div class="config-title">📊 统计</div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="needsTranslation">0</div>
                    <div class="stat-label">需要翻译</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">已完成</div>
                </div>
            </div>
            <button class="btn" id="startBtn" type="button">🚀 开始迁移</button>
            <button class="btn btn-secondary migrate-prompts-stop-btn" id="stopBtn" type="button">停止</button>
        </div>

        <!-- Progress Card -->
        <div class="config-card hidden" id="progressCard">
            <div class="config-title">📈 进度</div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备中...</div>
            </div>
        </div>

        <!-- Log Card -->
        <div class="config-card hidden" id="logCard">
            <div class="config-title">📝 日志</div>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <script src="../js/tools-migrate-prompts-bilingual-page.js"></script>
</body>

</html>
