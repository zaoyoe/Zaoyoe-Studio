<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时评论通知调试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin-bottom: 16px;
            font-size: 1.2rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .status-icon {
            font-size: 1.5rem;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        .log-area {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-time {
            color: #94a3b8;
            margin-right: 8px;
        }

        .log-success {
            color: #6ee7b7;
        }

        .log-error {
            color: #fca5a5;
        }

        .log-info {
            color: #93c5fd;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .info-item {
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .info-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            color: #1e293b;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>🔍 实时评论通知调试工具</h1>
            <p style="color: #64748b; margin-bottom: 20px;">用于诊断和测试 Gallery 页面的 Supabase Realtime 功能</p>

            <div id="connectionStatus"></div>

            <h2>📊 连接信息</h2>
            <div class="info-grid" id="infoGrid"></div>

            <div class="button-group">
                <button type="button" data-debug-action="refresh-status">🔄 刷新状态</button>
                <button type="button" data-debug-action="test-connection">🧪 测试连接</button>
                <button type="button" data-debug-action="clear-logs">🗑️ 清空日志</button>
            </div>
        </div>

        <div class="card">
            <h2>📝 实时日志</h2>
            <div class="log-area" id="logArea">
                <div class="log-entry">
                    <span class="log-time">[加载中]</span>
                    <span class="log-info">等待初始化...</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📖 使用说明</h2>
            <ol style="line-height: 2; color: #475569;">
                <li>打开此页面和 Gallery 页面（prompts.html）</li>
                <li>在另一个浏览器窗口登录并发送评论</li>
                <li>观察此页面的实时日志，查看是否收到 Realtime 事件</li>
                <li>如果日志中显示 "Realtime event received"，说明功能正常</li>
            </ol>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/runtime/supabase-config"></script>
    <script src="./js/runtime-supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="./js/debug-realtime-page.js"></script>
</body>

</html>
