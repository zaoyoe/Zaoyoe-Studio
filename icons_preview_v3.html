<!-- Set 3A: Neo-Glass 3D -->
<div class="set-container set-glass3d">
<h2>Set A: Neo-Glass 3D (浮空玻璃 3D)</h2>
<div class="icons-row">
<!-- Prompts: Flying Card + Magic Wand -->
<div class="icon-wrapper">
<svg fill="none" height="80" viewbox="0 0 80 80" width="80">
<defs>
<lineargradient id="g3d_p_1" x1="0" x2="80" y1="0" y2="80">
<stop offset="0" stop-color="#F472B6"></stop>
<stop offset="1" stop-color="#DB2777"></stop>
</lineargradient>
<lineargradient id="g3d_p_2" x1="0" x2="80" y1="0" y2="80">
<stop offset="0" stop-color="#fff" stop-opacity="0.8"></stop>
<stop offset="1" stop-color="#fff" stop-opacity="0.1"></stop>
</lineargradient>
</defs>
<!-- Shadow -->
<ellipse cx="40" cy="70" fill="black" fill-opacity="0.3" filter="blur(5px)" rx="20" ry="5"></ellipse>
<!-- Back Card -->
<rect class="layer-back" fill="url(#g3d_p_1)" height="40" opacity="0.6" rx="4" transform="rotate(-10 40 45)" width="30" x="25" y="25"></rect>
<!-- Front Card (Glass) -->
<rect class="layer-mid" fill="url(#g3d_p_2)" height="40" rx="4" stroke="white" stroke-width="1" transform="rotate(5 50 40)" width="30" x="35" y="20"></rect>
<!-- Wand (Floating) -->
<path class="layer-front" d="M15 65 L30 50 M30 50 L35 45" stroke="white" stroke-linecap="round" stroke-width="3"></path>
<path class="layer-front" d="M55 25 L35 45" stroke="#FCE7F3" stroke-linecap="round" stroke-width="4"></path>
<circle class="layer-front" cx="55" cy="25" fill="white" filter="drop-shadow(0 0 5px #fff)" r="3"></circle>
<!-- Sparkles -->
<path class="layer-front" d="M60 15 L62 20 L58 20 Z" fill="white">
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="0;1;0"></animate>
</path>
</svg>
<div class="icon-label">Prompts</div>
</div>
<!-- Shop: Floating Iso Box -->
<div class="icon-wrapper">
<svg fill="none" height="80" viewbox="0 0 80 80" width="80">
<defs>
<lineargradient id="g3d_s_1" x1="40" x2="40" y1="20" y2="70">
<stop offset="0" stop-color="#4ADE80"></stop>
<stop offset="1" stop-color="#16A34A"></stop>
</lineargradient>
<lineargradient id="g3d_s_2" x1="0" x2="1" y1="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.9"></stop>
<stop offset="1" stop-color="#ffffff" stop-opacity="0.2"></stop>
</lineargradient>
</defs>
<ellipse cx="40" cy="72" fill="black" fill-opacity="0.3" filter="blur(6px)" rx="22" ry="6"></ellipse>

<path class="layer-back" d="M40 65 L15 52 V28 L40 40 V65 Z" fill="#22c55e"></path> <!-- Left Face -->
<path class="layer-back" d="M40 65 L65 52 V28 L40 40 V65 Z" fill="#15803d"></path> <!-- Right Face -->
<path class="layer-mid" d="M40 40 L65 28 L40 16 L15 28 Z" fill="#86efac"></path> <!-- Top Face -->

<circle class="layer-front" cx="60" cy="16" fill="#22c55e" r="2" transform="rotate(10)"></circle>
</svg>
<div class="icon-label">Shop</div>
</div>
<!-- Verify: Holographic Shield -->
<div class="icon-wrapper">
<svg fill="none" height="80" viewbox="0 0 80 80" width="80">
<defs>
<lineargradient id="g3d_v_1" x1="40" x2="40" y1="10" y2="70">
<stop offset="0" stop-color="#667EEA"></stop>
<stop offset="1" stop-color="#4338CA"></stop>
</lineargradient>
<radialgradient cx="40" cy="40" id="g3d_v_glow" r="30">
<stop offset="0" stop-color="#818CF8" stop-opacity="0.6"></stop>
<stop offset="1" stop-color="#818CF8" stop-opacity="0"></stop>
</radialgradient>
</defs>
<circle class="layer-back" cx="40" cy="40" fill="url(#g3d_v_glow)" r="30"></circle>

<path class="layer-mid" d="M40 70 C40 70 65 60 65 30 V20 L40 10 L15 20 V30 C15 60 40 70 40 70 Z" fill="url(#g3d_v_1)" opacity="0.9" stroke="#A5B4FC" stroke-width="1"></path>

<path class="layer-front" d="M30 40 L40 50 L55 30" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"></path>
</svg>
<div class="icon-label">Verify</div>
</div>
<!-- Guestbook: Open Magic Book -->

<path class="layer-mid" d="M41 33 H68 V56 H41 Z" fill="#FFFBEB" transform="skewY(-10)"></path>

<path class="layer-front" d="M55 25 L45 35 L48 38 L50 20 Z" fill="#FCD34D"></path>
</svg>
<div class="icon-label">Guestbook</div>
</div>
