        /* Page specific styles */
        body {
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 70px 20px 40px;

        /* Starry Sky Canvas */

            top: -10vh;
            left: 0;
            width: 100vw;
            height: 120vh;
            z-index: 0;
            pointer-events: none;
            opacity: 1;
        }

        /* Page layout */

            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .verify-page-container {
            width: 100%;
            max-width: 1100px;
            animation: fadeInUp 0.5s ease;
            position: relative;
            z-index: 10;
            padding-top: 50px;
            /* Ensure content clears fixed header elements on all screens */
        }

        @media (max-width: 600px) {
            /* Mobile specific styles if needed */
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Page Header */
        .verify-page-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .verify-page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .visually-hidden-h1 {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .verify-page-header h1 i {
            color: #6b9ece;
        }

        .verify-page-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin: 0;
        }

        /* Back link - Icon Button Style */
        .back-link {
            position: fixed;
            top: 32px;
            left: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            z-index: 100;
        }

        .back-link:hover {
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Nav Logo SVG inside back-link */
        .back-link.nav-logo svg {
            width: 24px;
            height: 24px;
        }

        /* Info Cards */
        .verify-info-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }

        .verify-info-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .verify-info-card i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: block;
        }

        .verify-info-card .info-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .verify-info-card .info-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .verify-info-card.success i {
            color: #22c55e;
        }

        .verify-info-card.warning i {
            color: #fbbf24;
        }

        .verify-info-card.info i {
            color: #6b9ece;
        }

        /* Footer Styles */
        /* Footer Styles - Absolute Bottom (matches homepage) */
        .verify-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 30px 0;

        /* Responsive */

            .verify-info-cards {

            }

            .back-link {
                top: 32px;
                left: 16px;
            }

            body {
                padding-top: 70px;

                <!-- PRE-RENDER: Synchronous check of localStorage - inject CSS into HEAD (won't be overwritten by render) -->
                <script>
                    (function () {
                        try {
                            const cached = localStorage.getItem('cached_user_profile');
                            if (cached) {
                                const user = JSON.parse(cached);
                                if (user && (user.id || user.user_id)) {
                                    // User is logged in - inject CSS into HEAD (won't be removed by widget render)
                                    const style = document.createElement('style');
                                    style.id = 'verify-prerender-style';
                                    style.textContent = '#verifyBalance{display:flex!important}';
                                    document.head.appendChild(style);
                                    console.log('[VerifyPreRender] Injected logged-in CSS into head');
                                }
                            }
                        } catch (e) { console.warn('[VerifyPreRender] Error:', e); }
                    })();

    <!-- Load price from config -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data } = await window.supabaseClient
                    .from('system_config')
                    .select('config_value')
                    .eq('config_key', 'verify_settings')
                    .single();

                if (data?.config_value?.price_per_verify) {
                    const el = document.getElementById('displayPrice');
                    if (el) el.textContent = data.config_value.price_per_verify;
                }
            } catch (e) {
                // Config load is optional, widget handles its own config
