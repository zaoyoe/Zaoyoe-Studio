<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
    <title>重置密码 - Zaoyoe</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Core Styles -->
    <link rel="stylesheet" href="style.css?v=20260424_PUBLIC_LIGHT_MODAL_BACKDROP_1">
    <link rel="stylesheet" href="login_styles.css?v=20260314_LOGIN_GIT_876567B_RESTORE_1">

    <!-- Prevent flash of wrong theme -->
    <script src="./js/theme-preload.js"></script>

    <link rel="stylesheet" href="css/reset-password-page.css?v=20260324_RESET_PASSWORD_RUNTIME_STYLE_1">
</head>

<body>
    <!-- Ambient Light Canvas -->
    <canvas id="ambientCanvas"></canvas>

    <div class="reset-container">
        <div class="reset-card">
            <img src="assets/favicon.png" alt="Zaoyoe" class="reset-logo">
            <h1 class="reset-title">设置新密码</h1>
            <p class="reset-subtitle">请输入您的新密码以完成账号恢复</p>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <input type="password" id="new-password" class="glass-input" placeholder="新密码 (至少6位)" required
                        minlength="6">
                </div>
                <div class="input-group">
                    <input type="password" id="confirm-password" class="glass-input" placeholder="确认新密码" required
                        minlength="6">
                </div>

                <button type="submit" id="submitBtn" class="login-submit-btn">
                    <span>确认修改</span>
                </button>

                <div id="statusMessage" class="status-message" hidden></div>
            </form>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/api/runtime/supabase-config"></script>
    <script src="./js/runtime-supabase-config.js"></script>
    <script src="js/ambient-light.js"></script>
    <script src="./js/reset-password-page.js?v=20260324_RESET_PASSWORD_RUNTIME_STYLE_1"></script>
</body>

</html>
