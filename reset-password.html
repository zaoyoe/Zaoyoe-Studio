<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
    <title>重置密码 - Zaoyoe</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Core Styles -->
    <link rel="stylesheet" href="style.css?v=20260304_IOS_INPUT_FIX">
    <link rel="stylesheet" href="login_styles.css?v=20260302_G_AUTH">

    <!-- Prevent flash of wrong theme -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme !== 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }

        .reset-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
        }

        [data-theme="light"] .reset-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #1e293b;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .reset-logo {
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            border-radius: 16px;
        }

        .reset-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        [data-theme="light"] .reset-title {
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .reset-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
        }

        [data-theme="light"] .reset-subtitle {
            color: rgba(0, 0, 0, 0.5);
        }

        /* Ambient Canvas matching guestbook / index */
        #ambientCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .status-message {
            margin-top: 16px;
            font-size: 14px;
            color: #f87171;
            display: none;
            padding: 10px;
            border-radius: 8px;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .status-message.success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            border-color: rgba(74, 222, 128, 0.2);
        }

        .reset-card .input-group {
            margin-bottom: 20px;
        }

        .reset-card .glass-input {
            width: 100% !important;
            box-sizing: border-box !important;
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(155, 93, 229, 0.5) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            color: white !important;
            font-size: 16px !important;
            padding: 10px 16px !important;
            border-radius: 12px !important;
            height: 44px;
            transition: all 0.3s ease;
        }

        .reset-card .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .reset-card .glass-input:focus {
            background: rgba(0, 0, 0, 0.4) !important;
            border-color: rgba(155, 93, 229, 0.7) !important;
            box-shadow: 0 0 0 3px rgba(155, 93, 229, 0.15), 0 0 20px rgba(168, 85, 247, 0.12) !important;
        }

        [data-theme="light"] .reset-card .glass-input {
            background: rgba(255, 255, 255, 0.82) !important;
            border-color: rgba(148, 163, 184, 0.35) !important;
            color: #0f172a !important;
        }

        [data-theme="light"] .reset-card .glass-input::placeholder {
            color: rgba(15, 23, 42, 0.45);
        }

        [data-theme="light"] .reset-card .glass-input:focus {
            background: rgba(255, 255, 255, 0.95) !important;
            border-color: rgba(155, 93, 229, 0.55) !important;
            box-shadow: 0 0 0 3px rgba(155, 93, 229, 0.12), 0 0 20px rgba(168, 85, 247, 0.1) !important;
        }

        .reset-card .login-submit-btn {
            width: auto !important;
            min-width: 180px;
            max-width: 220px;
            padding: 12px 42px !important;
            margin: 8px auto 0 auto !important;
            display: block !important;
            border-radius: 14px !important;
            background: linear-gradient(135deg, #9b5de5 0%, #f15bb5 100%) !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            letter-spacing: 0.4px;
            box-shadow: 0 10px 28px rgba(155, 93, 229, 0.45) !important;
        }

        .reset-card .login-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(155, 93, 229, 0.5) !important;
        }

        .reset-card .login-submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed !important;
            transform: none;
            box-shadow: 0 6px 16px rgba(155, 93, 229, 0.2) !important;
        }
    </style>
</head>

<body>
    <!-- Ambient Light Canvas -->
    <canvas id="ambientCanvas"></canvas>

    <div class="reset-container">
        <div class="reset-card">
            <img src="assets/favicon.png" alt="Zaoyoe" class="reset-logo">
            <h1 class="reset-title">设置新密码</h1>
            <p class="reset-subtitle">请输入您的新密码以完成账号恢复</p>

            <form id="resetPasswordForm" onsubmit="handleNewPasswordSubmit(event)">
                <div class="input-group">
                    <input type="password" id="new-password" class="glass-input" placeholder="新密码 (至少6位)" required
                        minlength="6">
                </div>
                <div class="input-group">
                    <input type="password" id="confirm-password" class="glass-input" placeholder="确认新密码" required
                        minlength="6">
                </div>

                <button type="submit" id="submitBtn" class="login-submit-btn">
                    <span>确认修改</span>
                </button>

                <div id="statusMessage" class="status-message"></div>
            </form>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://auth.zaoyoe.com';
        const SUPABASE_KEY = 'sb_publishable_lwkiF-sQ80z8e9oMcejFPQ_j7oezjcF';
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
    <script src="js/ambient-light.js"></script>

    <script>
        async function handleNewPasswordSubmit(event) {
            event.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const statusMsg = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpan = submitBtn.querySelector('span');

            statusMsg.style.display = 'none';
            statusMsg.className = 'status-message';

            if (newPassword !== confirmPassword) {
                statusMsg.textContent = '❌ 两次输入的密码不一致';
                statusMsg.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                statusMsg.textContent = '❌ 密码长度不能少于6位';
                statusMsg.style.display = 'block';
                return;
            }

            // UI Loading state
            submitBtn.disabled = true;
            btnSpan.textContent = '修改中...';

            try {
                // Supabase consumes the token in the URL automatically to create a session
                // We just call updateUser with the new password
                const { error } = await window.supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                // Success
                statusMsg.textContent = '✅ 密码修改成功，正在返回主页...';
                statusMsg.className = 'status-message success';
                statusMsg.style.display = 'block';

                btnSpan.textContent = '修改成功';

                window.location.href = 'index.html';

            } catch (error) {
                console.error('修改密码失败:', error);
                // Handle token expiration or invalid link
                if (error.message.includes('Auth session missing') || error.message.includes('invalid')) {
                    statusMsg.textContent = '❌ 链接已失效或过期，请重新发起密码找回。';
                } else {
                    statusMsg.textContent = '❌ ' + (error.message || '系统错误，请重试');
                }
                statusMsg.style.display = 'block';
                submitBtn.disabled = false;
                btnSpan.textContent = '确认修改';
            }
        }

        // On load, check if URL has hash (access_token) or if a session exists
        document.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;

            // If the user lands here directly without a token and no active session, they shouldn't be here
            if (!hash && !window.location.search.includes('error')) {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (!session) {
                    const statusMsg = document.getElementById('statusMessage');
                    statusMsg.textContent = '无效的重置链接，或者链接已过期。请重新获取重置邮件。';
                    statusMsg.style.display = 'block';
                    document.getElementById('submitBtn').disabled = true;
                }
            } else if (window.location.search.includes('error=')) {
                // Supabase error redirect
                const params = new URLSearchParams(window.location.search);
                const statusMsg = document.getElementById('statusMessage');
                statusMsg.textContent = '错误: ' + (params.get('error_description') || '无效的重置请求');
                statusMsg.style.display = 'block';
                document.getElementById('submitBtn').disabled = true;
            }
        });
    </script>
</body>

</html>
