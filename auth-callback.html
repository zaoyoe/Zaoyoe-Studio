<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录处理中...</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #070b14;
            color: #cbd5e1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .box {
            width: min(420px, 92vw);
            padding: 24px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.72);
            text-align: center;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .desc {
            font-size: 14px;
            opacity: 0.85;
        }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/api/runtime/supabase-config"></script>
    <script src="./js/runtime-supabase-config.js"></script>
</head>

<body>
    <div class="box">
        <div class="title">正在完成登录</div>
        <div class="desc" id="statusText">请稍候，正在同步您的会话...</div>
    </div>

    <script>
        (async () => {
            const statusText = document.getElementById('statusText');
            const setStatus = (text) => { if (statusText) statusText.textContent = text; };
            const GOOGLE_POPUP_MESSAGE_TYPE = 'zaoyoe:google-auth-popup';
            const GOOGLE_POPUP_WINDOW_NAME = 'google_login';
            const GOOGLE_POPUP_RESULT_STORAGE_KEY = 'zaoyoe_google_popup_auth_result_v1';

            const { url: SUPABASE_URL, publishableKey: SUPABASE_KEY } = window.requireZaoyoeSupabaseConfig();
            const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: false,
                    detectSessionInUrl: false,
                    flowType: 'implicit'
                }
            });

            const redirectBack = () => {
                let target = localStorage.getItem('oauth_post_login_redirect') || '/';
                localStorage.removeItem('oauth_post_login_redirect');
                try {
                    const u = new URL(target, window.location.origin);
                    if (u.origin !== window.location.origin || /\/auth-callback\.html$/i.test(u.pathname)) {
                        target = '/';
                    }
                } catch (_) {
                    target = '/';
                }
                window.location.replace(target);
            };

            const isPopupWindow = () => !!(
                (window.opener && window.opener !== window) ||
                window.name === GOOGLE_POPUP_WINDOW_NAME
            );
            const broadcastPopupResult = (payload) => {
                try {
                    const envelope = JSON.stringify({
                        type: GOOGLE_POPUP_MESSAGE_TYPE,
                        emittedAt: Date.now(),
                        ...payload
                    });
                    localStorage.setItem(GOOGLE_POPUP_RESULT_STORAGE_KEY, envelope);
                    setTimeout(() => {
                        try {
                            if (localStorage.getItem(GOOGLE_POPUP_RESULT_STORAGE_KEY) === envelope) {
                                localStorage.removeItem(GOOGLE_POPUP_RESULT_STORAGE_KEY);
                            }
                        } catch (_) {
                            // ignore cleanup failure
                        }
                    }, 1500);
                } catch (err) {
                    console.warn('Failed to broadcast popup auth result:', err);
                }
            };
            const notifyOpener = (payload) => {
                broadcastPopupResult(payload);
                if (!window.opener || window.opener === window) return;
                try {
                    window.opener.postMessage({
                        type: GOOGLE_POPUP_MESSAGE_TYPE,
                        ...payload
                    }, window.location.origin);
                } catch (err) {
                    console.warn('Failed to notify opener from auth callback:', err);
                }
            };
            const attemptClosePopup = () => {
                if (!isPopupWindow()) return false;

                const tryClose = () => {
                    try {
                        window.close();
                    } catch (_) {
                        // ignore
                    }
                };

                tryClose();
                setTimeout(() => {
                    if (window.closed) return;
                    try {
                        window.open('', '_self');
                    } catch (_) {
                        // ignore
                    }
                    tryClose();
                }, 120);

                return true;
            };

            try {
                const url = new URL(window.location.href);
                const hash = window.location.hash || '';
                const isPopupMode = url.searchParams.get('popup') === '1';
                const isCloseOnlyMode = url.searchParams.get('close') === '1';
                const code = url.searchParams.get('code');
                const hashParams = new URLSearchParams(hash.replace(/^#/, ''));
                const hasAccessToken = !!hashParams.get('access_token');
                const hasRefreshToken = !!hashParams.get('refresh_token');
                const idToken = hashParams.get('id_token');
                const hashError = hashParams.get('error');

                if (isCloseOnlyMode) {
                    setStatus('登录已完成，正在关闭窗口...');
                    attemptClosePopup();
                    return;
                }

                if (code) {
                    setStatus('正在交换登录票据...');
                    const { error } = await client.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                } else if (idToken) {
                    setStatus('正在完成 Google 登录...');
                    const { error } = await client.auth.signInWithIdToken({
                        provider: 'google',
                        token: idToken
                    });
                    if (error) throw error;
                } else if (hasAccessToken && hasRefreshToken) {
                    setStatus('正在恢复登录会话...');
                    const access_token = hashParams.get('access_token');
                    const refresh_token = hashParams.get('refresh_token');
                    if (access_token && refresh_token) {
                        const { error } = await client.auth.setSession({ access_token, refresh_token });
                        if (error) throw error;
                    }
                }

                // Wait for detectSessionInUrl + cookie/localStorage sync (async) to settle.
                const waitForSession = async (timeoutMs = 9000, intervalMs = 250) => {
                    const started = Date.now();
                    while (Date.now() - started < timeoutMs) {
                        const { data: { session } } = await client.auth.getSession();
                        if (session) return session;
                        await new Promise((r) => setTimeout(r, intervalMs));
                    }
                    return null;
                };

                const session = await waitForSession();
                if (!session) {
                    const debugFlags = [
                        code ? 'code=1' : 'code=0',
                        hasAccessToken ? 'access=1' : 'access=0',
                        hasRefreshToken ? 'refresh=1' : 'refresh=0',
                        hashError ? `err=${hashError}` : 'err=0'
                    ].join(',');
                    console.warn('OAuth callback debug:', debugFlags, window.location.href);
                    throw new Error(`登录会话未建立 (${debugFlags})`);
                }

                setStatus('登录成功，正在返回...');
                if (isPopupWindow() || isPopupMode) {
                    const { data: { user } } = await client.auth.getUser().catch(() => ({ data: { user: null } }));
                    notifyOpener({
                        status: 'success',
                        userId: user?.id || null
                    });
                    setTimeout(() => {
                        attemptClosePopup();
                    }, 120);
                    return;
                }
                setTimeout(redirectBack, 120);
            } catch (err) {
                console.error('OAuth callback failed:', err);
                if (isPopupWindow() || isPopupMode) {
                    notifyOpener({
                        status: 'error',
                        message: err.message || '未知错误'
                    });
                    setTimeout(() => {
                        attemptClosePopup();
                    }, 200);
                    return;
                }
                setStatus(`登录失败：${err.message || '未知错误'}，正在返回主页...`);
                localStorage.removeItem('oauth_post_login_redirect');
                setTimeout(() => window.location.replace('/'), 1400);
            }
        })();
    </script>
</body>

</html>
