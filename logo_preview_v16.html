<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Logo Concepts - Extreme 3D Speed</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 60px;
            text-align: center;
        }

        .logo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: 0.3s ease;
        }

        .logo-item:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .label {
            font-family: 'Inter', sans-serif;
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }

        svg {
            width: 80px;
            height: 80px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap"
        rel="stylesheet">
</head>

<body>
    <h1>Extreme 3D Speed (Set 16)</h1>
    <div class="grid">
        <!-- Variant 57: Hyper-Shear 3D (Extruded Blocks) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Bottom Block -->
                <path d="M10 70 H60 L50 85 H0 L10 70 Z" fill="white" /> <!-- Face -->
                <path d="M60 70 L65 65 L55 80 L50 85 Z" fill="#666" /> <!-- Side -->

                <!-- Middle Block -->
                <path d="M30 50 H80 L70 65 H20 L30 50 Z" fill="white" />
                <path d="M80 50 L85 45 L75 60 L70 65 Z" fill="#666" />

                <!-- Top Block -->
                <path d="M50 30 H100 L90 45 H40 L50 30 Z" fill="white" />
                <path d="M100 30 L105 25 L95 40 L90 45 Z" fill="#666" />
            </svg>
            <div class="label">Variant 57: Hyper-Shear<br>(超剪切体)</div>
        </div>

        <!-- Variant 58: Warp Tunnel (Vanishing Point) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- The Face Z -->
                <path d="M30 30 H80 L60 70 H10 L30 30 Z" fill="white" opacity="1" />
                <!-- The Trail (Perspective) -->
                <path d="M80 30 L95 20" stroke="white" stroke-width="1" opacity="0.5" />
                <path d="M60 70 L75 60" stroke="white" stroke-width="1" opacity="0.5" />
                <path d="M10 70 L25 60" stroke="white" stroke-width="1" opacity="0.5" />
                <!-- Back Face ghost -->
                <path d="M45 20 H95 L75 60 H25 L45 20 Z" fill="white" opacity="0.2" />
            </svg>
            <div class="label">Variant 58: Warp Drifter<br>(曲速漂移)</div>
        </div>

        <!-- Variant 59: Aero-Blade (Polished Metal) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fff" />
                        <stop offset="50%" style="stop-color:#aaa" />
                        <stop offset="100%" style="stop-color:#fff" />
                    </linearGradient>
                </defs>
                <!-- Main Blade Body -->
                <path d="M20 30 H90 L60 80 H0 L20 30 Z" fill="url(#bladeGrad)" />
                <!-- Sharp Edge Highlight -->
                <path d="M20 30 L90 30 L60 80" stroke="white" stroke-width="2" fill="none" />
                <!-- Speed Lines -->
                <path d="M95 35 H105" stroke="white" stroke-width="2" />
                <path d="M70 85 H90" stroke="white" stroke-width="2" />
            </svg>
            <div class="label">Variant 59: Aero-Blade<br>(气动利刃)</div>
        </div>

        <!-- Variant 60: Quantum Dash (Fragmented Perspective) -->
        <div class="logo-item">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Front Z Fragments -->
                <path d="M30 20 H80 L70 35 H20 Z" fill="white" />
                <path d="M40 40 H90 L80 55 H30 Z" fill="white" />
                <path d="M20 60 H70 L60 75 H10 Z" fill="white" />

                <!-- Trailing Shadows (Deep Space) -->
                <path d="M80 20 L90 15 L80 30" fill="#333" />
                <path d="M90 40 L100 35 L90 50" fill="#333" />
                <path d="M70 60 L80 55 L70 70" fill="#333" />
            </svg>
            <div class="label">Variant 60: Quantum Dash<br>(量子冲刺)</div>
        </div>
    </div>
</body>

</html>
