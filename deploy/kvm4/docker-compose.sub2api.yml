services:
  sub2api:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: zaoyoe/newapi:local
    container_name: sub2api
    restart: unless-stopped
    stop_grace_period: 130s
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:3000"
    volumes:
      - ./newapi_data:/data
    environment:
      - PORT=3000
      - GIN_MODE=release
      - SQL_DSN=postgresql://${POSTGRES_USER:-sub2api}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${NEWAPI_DB_NAME:-newapi}?sslmode=disable
      - REDIS_CONN_STRING=${NEWAPI_REDIS_CONN_STRING:-redis://redis:6379/1}
      - SESSION_SECRET=${NEWAPI_SESSION_SECRET:?NEWAPI_SESSION_SECRET is required}
      - NEWAPI_REGIONAL_EDGE_SECRET=${NEWAPI_REGIONAL_EDGE_SECRET:?NEWAPI_REGIONAL_EDGE_SECRET is required}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://new.fatherkey.com,https://sub2api.fatherkey.com
      - BATCH_UPDATE_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      legacy-sub2api:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Phase-one compatibility bridge. NewAPI owns the public port and all user,
  # key, quota, and regional-policy state. The legacy process remains private
  # only while its upstream account scheduler is migrated separately.
  legacy-sub2api:
    image: zaoyoe/sub2api:legacy
    container_name: sub2api-legacy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - RUN_MODE=${RUN_MODE:-standard}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-Asia/Shanghai}
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}
      - GEMINI_CLI_OAUTH_CLIENT_ID=${GEMINI_CLI_OAUTH_CLIENT_ID:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_ID=${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - GEMINI_IMAGE_BRIDGE_R2_ENDPOINT=${GEMINI_IMAGE_BRIDGE_R2_ENDPOINT:-}
      - GEMINI_IMAGE_BRIDGE_R2_ACCESS_KEY_ID=${GEMINI_IMAGE_BRIDGE_R2_ACCESS_KEY_ID:-}
      - GEMINI_IMAGE_BRIDGE_R2_SECRET_ACCESS_KEY=${GEMINI_IMAGE_BRIDGE_R2_SECRET_ACCESS_KEY:-}
      - GEMINI_IMAGE_BRIDGE_R2_BUCKET_NAME=${GEMINI_IMAGE_BRIDGE_R2_BUCKET_NAME:-}
      - GEMINI_IMAGE_BRIDGE_R2_PUBLIC_URL=${GEMINI_IMAGE_BRIDGE_R2_PUBLIC_URL:-}
      - GEMINI_IMAGE_BRIDGE_R2_REGION=${GEMINI_IMAGE_BRIDGE_R2_REGION:-}
      - AI_IMAGE_R2_ENDPOINT=${AI_IMAGE_R2_ENDPOINT:-}
      - AI_IMAGE_R2_ACCESS_KEY_ID=${AI_IMAGE_R2_ACCESS_KEY_ID:-}
      - AI_IMAGE_R2_SECRET_ACCESS_KEY=${AI_IMAGE_R2_SECRET_ACCESS_KEY:-}
      - AI_IMAGE_R2_BUCKET_NAME=${AI_IMAGE_R2_BUCKET_NAME:-zaoyoeimages}
      - AI_IMAGE_R2_PUBLIC_URL=${AI_IMAGE_R2_PUBLIC_URL:-https://cdn.fatherkey.com}
      - AI_IMAGE_R2_REGION=${AI_IMAGE_R2_REGION:-auto}
      - SECURITY_URL_ALLOWLIST_ENABLED=${SECURITY_URL_ALLOWLIST_ENABLED:-true}
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      - SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS=${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./redis_data:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else unset REDISCLI_AUTH; redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-network:
    driver: bridge
