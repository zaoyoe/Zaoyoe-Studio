services:
  sub2api:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: zaoyoe/newapi:local
    container_name: sub2api
    restart: unless-stopped
    stop_grace_period: 130s
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:3000"
    volumes:
      - ./newapi_data:/data
    environment:
      - PORT=3000
      - GIN_MODE=release
      - SQL_DSN=postgresql://${POSTGRES_USER:-sub2api}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${NEWAPI_DB_NAME:-newapi}?sslmode=disable
      - REDIS_CONN_STRING=${NEWAPI_REDIS_CONN_STRING:-redis://redis:6379/1}
      - SESSION_SECRET=${NEWAPI_SESSION_SECRET:?NEWAPI_SESSION_SECRET is required}
      - NEWAPI_REGIONAL_EDGE_SECRET=${NEWAPI_REGIONAL_EDGE_SECRET:?NEWAPI_REGIONAL_EDGE_SECRET is required}
      # The support bridge remains disabled unless both gateway settings exist.
      - NEWAPI_SUPPORT_GATEWAY_URL=${NEWAPI_SUPPORT_GATEWAY_URL:-}
      - NEWAPI_SUPPORT_GATEWAY_HMAC_SECRET=${NEWAPI_SUPPORT_GATEWAY_HMAC_SECRET:-}
      - NEWAPI_SUPPORT_GATEWAY_TIMEOUT_SECONDS=${NEWAPI_SUPPORT_GATEWAY_TIMEOUT_SECONDS:-}
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=https://new.fatherkey.com
      - BATCH_UPDATE_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./redis_data:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else unset REDISCLI_AUTH; redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-network:
    driver: bridge
