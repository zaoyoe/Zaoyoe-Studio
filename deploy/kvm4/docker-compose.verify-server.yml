services:
  verify-server:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    container_name: zaoyoe-verify-server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DEPLOYMENT_TIER: production
      PORT: "3001"
      ALLOWED_ORIGINS: "https://fatherkey.com,https://www.fatherkey.com,https://zaoyoe.com,https://www.zaoyoe.com,https://zaoyoe.xyz,https://www.zaoyoe.xyz"
      TRUSTED_PROXY_IPS: "127.0.0.1,::1,172.19.0.1"
      VERIFY_SERVER_WORKERS_ENABLED: "true"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  ai-image-worker:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    container_name: zaoyoe-ai-image-worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
    command:
      - npm
      - run
      - ai-image:worker
      - --
      - --site
      - cn
      - --limit
      - "8"
      - --concurrency
      - "4"
      - --interval-ms
      - "1000"
    depends_on:
      verify-server:
        condition: service_healthy
  prompt-import-worker:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    container_name: zaoyoe-prompt-import-worker
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PROMPT_IMPORT_WORKER_CONCURRENCY: "10"
      PROMPT_IMPORT_WORKER_INITIAL_CONCURRENCY: "3"
      PROMPT_IMPORT_WORKER_INTERVAL_MS: "2000"
    command:
      - npm
      - run
      - prompt-import:worker
    depends_on:
      verify-server:
        condition: service_healthy
