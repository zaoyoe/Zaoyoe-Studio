<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>个人资料 - 资料Tab移动端快速预览</title>
  <link rel="stylesheet" href="./css/profile-mobile-tab-preview.css?v=20260324_PROFILE_PREVIEW_STYLES_1">
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status">iPhone 17 Safari · 9:41</div>

      <div class="tabs">
        <div class="tab active">资料</div>
        <div class="tab">安全</div>
      </div>

      <div class="content">
        <section class="card hero">
          <div class="hero-top">
            <div class="avatar">林</div>
            <div class="hero-main">
              <div class="name">林晚青</div>
              <div class="meta">ID 103294 · 杭州</div>
              <div class="badge">资料完整度 86%</div>
            </div>
          </div>
          <div class="signature">在慢慢搭建自己的效率系统，欢迎交流创作和产品设计。</div>
        </section>

        <section class="card">
          <div class="section-title">基础资料</div>
          <div class="info-row">
            <div class="info-key">昵称</div>
            <div class="info-val">林晚青</div>
          </div>
          <div class="info-row">
            <div class="info-key">邮箱</div>
            <div class="info-val">lin@example.com</div>
          </div>
          <div class="info-row">
            <div class="info-key">注册时间</div>
            <div class="info-val">2025-10-22</div>
          </div>
          <div id="moreBlock" class="more">
            <div class="info-row">
              <div class="info-key">职业</div>
              <div class="info-val">产品设计师</div>
            </div>
            <div class="info-row">
              <div class="info-key">生日</div>
              <div class="info-val">1998-07-19</div>
            </div>
          </div>
          <button id="moreBtn" class="more-btn">展开更多资料</button>
        </section>

        <section class="card">
          <div class="section-title">兴趣与风格</div>
          <div class="chips">
            <span class="chip">极简主义</span>
            <span class="chip">AI 工作流</span>
            <span class="chip">摄影</span>
            <span class="chip">咖啡探索</span>
            <span class="chip">沉浸式阅读</span>
          </div>
        </section>

        <section class="card">
          <div class="section-title">账号与联系</div>
          <div class="info-row">
            <div class="info-key">手机号</div>
            <div class="info-val">+86 138****9001</div>
          </div>
          <div class="info-row">
            <div class="info-key">微信</div>
            <div class="info-val">lin-qing</div>
          </div>
        </section>
      </div>

      <div class="bottom-bar">
        <button class="btn ghost">隐私设置</button>
        <button class="btn primary">编辑资料</button>
      </div>
    </div>
  </div>

  <script src="./js/profile-mobile-tab-preview.js"></script>
</body>
</html>
