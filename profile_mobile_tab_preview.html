<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>个人资料 - 资料Tab移动端快速预览</title>
  <style>
    :root {
      --bg-page: #edf1f4;
      --bg-shell: #f6f7f9;
      --bg-card: #ffffff;
      --text-main: #1c2430;
      --text-sub: #6d7988;
      --text-soft: #8f99a5;
      --line: #e8edf2;
      --brand: #1877a8;
      --brand-soft: #e8f4fa;
      --success: #1f9d6a;
      --shadow: 0 10px 30px rgba(28, 36, 48, 0.08);
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 20% -10%, #dbe8f1 0%, transparent 40%),
        radial-gradient(circle at 90% 0%, #f6e8db 0%, transparent 42%),
        var(--bg-page);
      font-family: "PingFang SC", "SF Pro Text", "Helvetica Neue", -apple-system, sans-serif;
      color: var(--text-main);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .phone {
      width: min(393px, 100vw - 24px);
      height: min(852px, 100dvh - 24px);
      border-radius: 34px;
      background: #0f1720;
      padding: 10px;
      box-shadow: 0 24px 60px rgba(15, 23, 32, 0.22);
    }

    .screen {
      height: 100%;
      border-radius: 26px;
      background: var(--bg-shell);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #96a2af;
      font-size: 11px;
      letter-spacing: 0.3px;
      background: linear-gradient(180deg, #f4f7fa 0%, #f6f7f9 100%);
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 8px 16px 10px;
      background: rgba(246, 247, 249, 0.9);
      backdrop-filter: saturate(160%) blur(10px);
      -webkit-backdrop-filter: saturate(160%) blur(10px);
      border-bottom: 1px solid rgba(232, 237, 242, 0.85);
    }

    .tab {
      height: 36px;
      border-radius: 999px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-soft);
      background: #f0f3f6;
    }

    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, #1b7aaa, #125e83);
      box-shadow: 0 8px 18px rgba(24, 119, 168, 0.24);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px calc(120px + env(safe-area-inset-bottom));
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #f3f5f7;
    }

    .hero {
      padding: 18px;
      background:
        linear-gradient(145deg, #ffffff 0%, #f7fbff 68%, #f3f8fb 100%);
    }

    .hero-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcf9a, #ff8f7d);
      display: grid;
      place-items: center;
      font-size: 26px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(255, 143, 125, 0.36);
    }

    .hero-main {
      min-width: 0;
      flex: 1;
    }

    .name {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-main);
    }

    .meta {
      margin-top: 4px;
      color: var(--text-sub);
      font-size: 13px;
    }

    .badge {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eaf8f1;
      color: var(--success);
      font-size: 12px;
      font-weight: 500;
    }

    .signature {
      margin-top: 14px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: #f4f8fb;
      color: #4e5c6b;
      font-size: 14px;
      line-height: 1.45;
    }

    .section-title {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }

    .info-row {
      min-height: 44px;
      display: grid;
      grid-template-columns: 86px 1fr;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
    }

    .info-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .info-key {
      color: var(--text-soft);
      font-size: 14px;
    }

    .info-val {
      color: var(--text-main);
      font-size: 15px;
      text-align: right;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      font-size: 13px;
      color: #245676;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--brand-soft);
      border: 1px solid #dceff9;
    }

    .more {
      display: none;
    }

    .more.show {
      display: block;
      animation: fade-in 180ms ease;
    }

    .more-btn {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: #f1f5f9;
      color: #556271;
      font-size: 14px;
      font-weight: 500;
    }

    .bottom-bar {
      position: sticky;
      bottom: 0;
      z-index: 9;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(
        180deg,
        rgba(246, 247, 249, 0.2) 0%,
        rgba(246, 247, 249, 0.96) 35%,
        rgba(246, 247, 249, 1) 100%
      );
      border-top: 1px solid rgba(232, 237, 242, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      gap: 10px;
    }

    .btn {
      height: 46px;
      border-radius: 14px;
      border: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .btn.primary {
      flex: 1.4;
      background: linear-gradient(135deg, #1b7aaa, #125e83);
      color: #fff;
      box-shadow: 0 10px 20px rgba(24, 119, 168, 0.25);
    }

    .btn.ghost {
      flex: 1;
      background: #e9eff4;
      color: #375065;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status">iPhone 17 Safari · 9:41</div>

      <div class="tabs">
        <div class="tab active">资料</div>
        <div class="tab">安全</div>
      </div>

      <div class="content">
        <section class="card hero">
          <div class="hero-top">
            <div class="avatar">林</div>
            <div class="hero-main">
              <div class="name">林晚青</div>
              <div class="meta">ID 103294 · 杭州</div>
              <div class="badge">资料完整度 86%</div>
            </div>
          </div>
          <div class="signature">在慢慢搭建自己的效率系统，欢迎交流创作和产品设计。</div>
        </section>

        <section class="card">
          <div class="section-title">基础资料</div>
          <div class="info-row">
            <div class="info-key">昵称</div>
            <div class="info-val">林晚青</div>
          </div>
          <div class="info-row">
            <div class="info-key">邮箱</div>
            <div class="info-val">lin@example.com</div>
          </div>
          <div class="info-row">
            <div class="info-key">注册时间</div>
            <div class="info-val">2025-10-22</div>
          </div>
          <div id="moreBlock" class="more">
            <div class="info-row">
              <div class="info-key">职业</div>
              <div class="info-val">产品设计师</div>
            </div>
            <div class="info-row">
              <div class="info-key">生日</div>
              <div class="info-val">1998-07-19</div>
            </div>
          </div>
          <button id="moreBtn" class="more-btn">展开更多资料</button>
        </section>

        <section class="card">
          <div class="section-title">兴趣与风格</div>
          <div class="chips">
            <span class="chip">极简主义</span>
            <span class="chip">AI 工作流</span>
            <span class="chip">摄影</span>
            <span class="chip">咖啡探索</span>
            <span class="chip">沉浸式阅读</span>
          </div>
        </section>

        <section class="card">
          <div class="section-title">账号与联系</div>
          <div class="info-row">
            <div class="info-key">手机号</div>
            <div class="info-val">+86 138****9001</div>
          </div>
          <div class="info-row">
            <div class="info-key">微信</div>
            <div class="info-val">lin-qing</div>
          </div>
        </section>
      </div>

      <div class="bottom-bar">
        <button class="btn ghost">隐私设置</button>
        <button class="btn primary">编辑资料</button>
      </div>
    </div>
  </div>

  <script src="./js/profile-mobile-tab-preview.js"></script>
</body>
</html>
