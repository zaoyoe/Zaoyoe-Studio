<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f5f4" />
    <title>计件器 · Rolling counter</title>

      <link rel="stylesheet" href="inline-rolling-counter-preview-1.css">
    <link rel="stylesheet" href="css/rolling-counter-preview-inline.css?v=20261109_INLINE_1">
</head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="wordmark">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h6M3 11.5h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </span>
          <span>Bencho / Components</span>
        </div>
        <span class="license">MIT licensed</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="title">
          <p class="eyebrow">数字组件 · 01</p>
          <h1 id="title">计件器</h1>
          <p class="lede">每个数字都像里程表一样独立滚动，进位时从个位开始依次落位。</p>
        </section>

        <section class="stage" aria-label="计件器预览">
          <div>
            <div
              class="rct inline-style-rolling-counter-preview-1"
              data-stroke="on"

            >
              <button type="button" class="rct-btn" data-dir="-1" aria-label="减少">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
              </button>

              <div
                class="rct-num"
                role="spinbutton"
                aria-valuenow="95"
                aria-valuemin="0"
                aria-valuemax="99999"
                aria-label="计数。上下拖动数字以改变数值。"
                tabindex="0"
              >
                <span class="rct-pair">
                  <span class="rct-col" data-place="4"><span class="rct-strip"></span></span>
                </span>
                <span class="rct-pair">
                  <span class="rct-col" data-place="3"><span class="rct-strip"></span></span>
                  <span class="rct-sep">,</span>
                </span>
                <span class="rct-pair"><span class="rct-col" data-place="2"><span class="rct-strip"></span></span></span>
                <span class="rct-pair"><span class="rct-col" data-place="1"><span class="rct-strip"></span></span></span>
                <span class="rct-pair"><span class="rct-col" data-place="0"><span class="rct-strip"></span></span></span>
              </div>

              <button type="button" class="rct-btn" data-dir="1" aria-label="增加">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
              </button>
            </div>
            <p class="stage-note">点击、按住，或上下拖动数字</p>
          </div>
        </section>

        <section class="control-panel" aria-label="动画参数">
          <div class="control">
            <div class="control-head"><label for="bounce">弹性</label><output id="bounce-output">45</output></div>
            <input id="bounce" type="range" min="0" max="100" value="45" />
          </div>
          <div class="control">
            <div class="control-head"><label for="stagger">错位</label><output id="stagger-output">45 ms</output></div>
            <input id="stagger" type="range" min="0" max="120" value="45" />
          </div>
          <div class="control">
            <div class="control-head"><label for="blur">滚动模糊</label><output id="blur-output">50</output></div>
            <input id="blur" type="range" min="0" max="100" value="50" />
          </div>
        </section>

        <div class="shape-control">
          <span class="shape-label">外框圆角</span>
          <div class="segmented" role="group" aria-label="外框圆角">
            <button type="button" data-corner="10" aria-pressed="false">柔和</button>
            <button type="button" data-corner="16" aria-pressed="true">圆润</button>
            <button type="button" data-corner="28" aria-pressed="false">胶囊</button>
          </div>
        </div>
      </main>

      <footer>
        <span>BENCHO · INTERACTION STUDY</span>
        <span>Preview</span>
      </footer>
    </div>

    <script src="inline-rolling-counter-preview-1.js?v=20261109_INLINE_1"></script>
  </body>
</html>
